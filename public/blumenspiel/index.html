<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Blumenspiel</title>
<style>
  :root { --bg: #1d2b1f; --fg: #fff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .pad { position: fixed; bottom: 14px; display: flex; gap: 12px; z-index: 5; }
  .pad.left { left: 16px; } .pad.right { right: 16px; }
  body:not(.playing) .pad { display: none; }
  body:not(.bossfight) .pad .throw { display: none; }
  .pad .throw { border-color: #c77dff; background: #c77dff66; }
  .pad.small button { width: 58px; height: 58px; font-size: 26px; }
  .pad.small { gap: 8px; }
  #padR.small button { border-color: #ff6fae; background: #ff6fae55; }
  #padL.small button { border-color: #36b6f0; background: #36b6f055; }
  #mute, #quit { position: fixed; right: 16px; top: 92px; z-index: 6; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #ffffffcc;
    background: #ffffff55; touch-action: none; padding: 0; display: grid; place-items: center; cursor: pointer; }
  #quit { display: none; }
  body:not(.ingame) #mute { top: 12px; }
  body.ingame #quit { display: grid; }
  body.ingame #quit { top: 104px; }
  body.ingame #mute { top: 160px; }
  #mute svg, #quit svg { width: 26px; height: 26px; }
  .pad button svg { width: 52%; height: 52%; display: block; margin: auto; pointer-events: none; filter: drop-shadow(0 2px 2px #0005); }
  #mute svg, #quit svg { filter: drop-shadow(0 1px 2px #0005); }
  .pad .tag { align-self: center; font-weight: bold; font-size: 18px; text-shadow: 0 2px 3px #0008; }
  .pad button { width: 74px; height: 74px; border-radius: 50%; border: 3px solid #ffffffcc; background: #ffffff44;
    padding: 0; color: #fff; touch-action: none; }
  .pad button:active, .pad button.on { background: #ffffff88; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="pad left" id="padL"></div>
<div class="pad right" id="padR"></div>
<button id="quit" aria-label="Zurück zum Startmenü"></button>
<button id="mute" aria-label="Musik an oder aus"></button>
<script>
"use strict";
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W = 0, H = 0, S = 1; // S = scale so the game looks the same on every screen
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = H / 600;
}
addEventListener('resize', resize); resize();

/* ---------- Welten ---------- */
const WORLDS = [
  { name: 'Wald', sky: ['#8fd3ff', '#d9f4ff'], hill: '#4f9a4a', hill2: '#3a7d3c', ground: '#5cb85c', dirt: '#7a4e2d', deco: 'wald', len: 12000,
    foes: ['leaf'], helper: { kind: 'gaensebluemchen', name: 'Gänseblümchen', tip: 'Hallo! Halte ⬇ gedrückt, dann gräbst du dich ein. Das kostet einen lila Samen. Die Blätter fliegen dann über dich drüber!' } },
  { name: 'Wiese', sky: ['#7ec8ff', '#fff3c4'], hill: '#8fd16a', hill2: '#6dbb55', ground: '#9be07a', dirt: '#8a5a33', deco: 'wiese', len: 13000,
    foes: ['blumi', 'blumi', 'leaf'], helper: { kind: 'loewenzahn', name: 'Löwenzahn', tip: 'Vorsicht, hier stampft ein böses Blumenmonster herum! Hüpf drüber oder grab dich ein. Jeder lila Samen hilft dir einmal.' } },
  { name: 'Strand', sky: ['#5ec2ff', '#ffe9c9'], hill: '#3fb5d6', hill2: '#2a9cc4', ground: '#f6dc9a', dirt: '#d9b46a', deco: 'strand', len: 14000,
    foes: ['meer', 'meer', 'leaf'], helper: { kind: 'hibiskus', name: 'Hibiskus', tip: 'Huhu! Vorsicht, aus dem Wasser kriecht ein gemeines Meermonster! Hüpf drüber oder grab dich ein.' } },
  { name: 'Wüste', sky: ['#ffb36b', '#ffe6a8'], hill: '#e9b35f', hill2: '#d89a45', ground: '#f3c977', dirt: '#c98f45', deco: 'wueste', len: 15000,
    foes: ['troll', 'troll', 'leaf'], helper: { kind: 'kaktusbluete', name: 'Kaktusblüte', tip: 'Pass auf, hier wohnen gemeine Trolle! Spring drüber oder grab dich ein.' } },
  { name: 'Schneeberg', sky: ['#9fb8ff', '#f2f6ff'], hill: '#c9d6f2', hill2: '#aebfe6', ground: '#ffffff', dirt: '#9aa9c9', deco: 'schnee', len: 16000,
    foes: ['yeti', 'yeti', 'leaf'], helper: { kind: 'schneegloeckchen', name: 'Schneeglöckchen', tip: 'Brrr! Die Schneemonster sind gemein. Und wenn ein Schneesturm kommt: grab dich ein oder geh ins Blumenhaus!' } },
  { name: 'Blumenparty', sky: ['#ffb3e6', '#fff0fa'], hill: '#ff8ad8', hill2: '#c77dff', ground: '#9be07a', dirt: '#8a5a33', deco: 'party', len: 7000,
    foes: [], boss: 'koenig', secretAt: [0.45, 0.8],
    helper: { kind: 'hibiskus', name: 'Partyblume', tip: 'Juhuu! Willkommen auf der großen Blumenparty! Psst, hier sind auch zwei Geheimtüren versteckt.' } },
  { name: 'Regenbogenland', sky: ['#9fe3ff', '#fff0fb'], hill: '#b9a6ff', hill2: '#9fd8ff', ground: '#a8f0a0', dirt: '#8a6bc9', deco: 'regenbogen', len: 12000,
    foes: ['wurm', 'wurm', 'leaf'], helper: { kind: 'regenbogenblume', name: 'Regenbogenblume', tip: 'Hallo! Pass auf das Regenwurmmonster auf, es schlängelt sich hier herum! Hüpf drüber oder grab dich ein.' } },
  { name: 'Süßigkeitenland', sky: ['#ffc4e1', '#fff6e0'], hill: '#ff9ecb', hill2: '#ffd1e8', ground: '#fff5fa', dirt: '#7b4a2e', deco: 'suess', len: 13000,
    foes: ['lolli', 'lolli', 'leaf'], helper: { kind: 'zuckerblume', name: 'Zuckerblume', tip: 'Mmmh, hier ist alles süß! Aber Vorsicht vor dem Lolly-Monster, das ist gar nicht süß! Hüpf drüber oder grab dich ein.' } },
  { name: 'Nachtgarten', sky: ['#141a4a', '#3b2f7a'], hill: '#2a3a6a', hill2: '#1e2a55', ground: '#2f6b4f', dirt: '#3a2a40', deco: 'nacht', len: 14000,
    foes: ['nachtm', 'nachtm', 'fleder'], helper: { kind: 'mondblume', name: 'Mondblume', tip: 'Psst, ganz leise! Hier schleicht ein Nachtmonster herum, und freche Fledermäuse fliegen auch. Hüpf drüber oder grab dich ein!' } },
  { name: 'Unterwasserwelt', sky: ['#5fd0ff', '#1a6fb0'], hill: '#3a8fc0', hill2: '#2a7ab0', ground: '#f2dca0', dirt: '#d4b878', deco: 'wasser', len: 14000,
    foes: ['krake', 'krake', 'qualle'], boss: 'krake', helper: { kind: 'seerose', name: 'Seeanemone', tip: 'Blubb! Willkommen unter Wasser! Vorsicht vor dem Tintenfischmonster und den Quallen. Und ganz am Ende wartet der Krakenkönig. Sammle Samen zum Werfen!' } },
  { name: 'Blumen-City', sky: ['#9fdcff', '#fff4fb'], hill: '#c9b8ff', hill2: '#ffc4e1', ground: '#9be07a', dirt: '#8a5a33', deco: 'city', len: 9000,
    foes: [], helper: { kind: 'stadtblume', name: 'Bürgermeisterblume', tip: 'Willkommen in Blumen-City! Hier wohnen alle Blumen aus allen Ländern zusammen. Keine Bösewichte, nur Freunde! Du hast es geschafft!' } },
];

/* ---------- Zustand ---------- */
const st = {
  screen: 'start',   // start | play | star | home | win
  kind: 'tulpe', kind2: 'rose', two: false, picker: 0,
  world: 0, stars: 0,
  hearts: 4, seeds: 0,
  x: 120, vy: 0, jumpY: 0, digging: 0, hurt: 0, walk: 0, face: 1,
  camX: 0, leaves: [], seedsOnMap: [], sparkles: [], leafTimer: 6, msgT: 0, msg: '',
  screenT: 0, flakes: [], checkpoint: 140, homeFrom: 'die', sleepT: 0, homeMode: 'menu', eaten: 0, btns: [], hidCount: 0, nearDoor: false, helperTalk: 0, secrets: [], returnX: 0,
};
const KINDS = ['tulpe', 'rose', 'sonnenblume', 'mohn'];
const NAMES = { tulpe: ['Fratz', 'die Tulpe'], rose: ['Mara', 'die Rose'], sonnenblume: ['Lina', 'die Sonnenblume'], mohn: ['Mona', 'die Mohnblume'] };
const mkKeys = () => ({ left: false, right: false, dig: false, hop: false, throw: false });
// Spieler 1 und Spieler 2 (beim Spielen zu zweit)
const P = [0, 1].map(id => ({ id, x: 140, vy: 0, jumpY: 0, digging: 0, hurt: 0, walk: 0, face: 1, digPaid: false, digWarned: false, nearDoor: false, keys: mkKeys() }));
const keys = P[0].keys;
function seedMax() { return st.two ? 10 : 5; }
function players() { return st.two ? P : [P[0]]; }
function kindOf(p) { return p.id ? st.kind2 : st.kind; }
function nameOf(p) { return NAMES[kindOf(p)][0]; }
function leadX() { return Math.max(...players().map(p => p.x)); }

function groundY(x) {
  // sanfte Hügel
  return H * 0.74 + Math.sin(x * 0.006) * 26 * S + Math.sin(x * 0.0023 + 1) * 18 * S;
}

const HOUSE_X = 240;
const BOSSNAME = { koenig: 'Blätterkönig', krake: 'Krakenkönig' };
// Blumenfeen: in jedem Land eine, sie schenkt einen Zauber
const POWERS = ['huepf', 'schild', 'flitz', 'magnet', 'schild', 'herz', 'huepf', 'flitz', 'schild', 'magnet', 'herz'];
const POWER = {
  schild: { name: 'Schutzblase', dur: 20, c: '#6fd3ff', say: 'eine Schutzblase! Jetzt können dir die Bösewichte nichts tun.' },
  huepf:  { name: 'Hüpfzauber', dur: 20, c: '#c77dff', say: 'den Hüpfzauber! Jetzt kannst du ohne Samen hüpfen.' },
  flitz:  { name: 'Flitzezauber', dur: 15, c: '#ffb000', say: 'den Flitzezauber! Jetzt bist du superschnell.' },
  magnet: { name: 'Samenmagnet', dur: 20, c: '#ff6fae', say: 'den Samenmagnet! Die Samen fliegen jetzt zu dir.' },
  herz:   { name: 'Herzzauber', dur: 0, c: '#ff4f6d', say: 'den Herzzauber! Alle Herzen sind wieder voll.' },
};
// Tag und Nacht: alle zweieinhalb Minuten wird es eine Weile Nacht
const DAY = 150;
function nightAmt() {
  if (st.screen !== 'play' && st.screen !== 'star') return 0;
  return nightRaw();
}
// ist es draußen gerade Nacht? (auch wenn man im Haus ist)
function nightOutside() { return WORLDS[st.world].deco === 'nacht' || nightRaw() > 0.5; }
function nightRaw() {
  const d = WORLDS[st.world].deco; if (d === 'nacht' || d === 'wasser') return 0;
  const q = (st.dayT || 0) % DAY;
  return q < 90 ? 0 : q < 100 ? (q - 90) / 10 : q < 140 ? 1 : 1 - (q - 140) / 10;
}
// Blumen-City: in manchen Häuschen wohnen Blumen aus allen Ländern, man kann sie besuchen
const RESIDENTS = [
  ['gaensebluemchen', 'Gänseblümchen', 0, 'Hallo! Ich komme aus dem Wald. Dort habe ich dir gezeigt, wie man sich eingräbt. Weißt du noch?'],
  ['loewenzahn', 'Löwenzahn', 1, 'Schön, dass du da bist! Auf der Wiese puste ich meine Schirmchen in den Wind. Hui!'],
  ['hibiskus', 'Hibiskus', 2, 'Aloha! Ich vermisse den Strand ein bisschen. Aber hier in der Stadt gibt es so viele Freunde!'],
  ['kaktusbluete', 'Kaktusblüte', 3, 'Willkommen! Ich brauche fast kein Wasser. Aber ein Besuch freut mich immer!'],
  ['schneegloeckchen', 'Schneeglöckchen', 4, 'Brrr, hier ist es schön warm! Möchtest du einen heißen Kakao?'],
  ['regenbogenblume', 'Regenbogenblume', 6, 'Hallo! Weißt du, welche Farbe ich am liebsten mag? Alle!'],
  ['zuckerblume', 'Zuckerblume', 7, 'Mmmh, ich backe gerade Blumenkekse. Riechst du das?'],
  ['mondblume', 'Mondblume', 8, 'Psst, ich bin ein bisschen müde. Ich bin ja die ganze Nacht wach gewesen!'],
  ['seerose', 'Seeanemone', 9, 'Blubb! Ich wohne in einem Haus mit einem großen Aquarium. Schau mal, die Fische!'],
];
function cityHouse(i) { return Math.abs(Math.sin(i * 12.9898) * 43758.5) % 1 > 0.62; }
function enterVisit(i) {
  const res = RESIDENTS[Math.abs(i) % RESIDENTS.length];
  st.visited = st.visited || {}; let gift = null;
  if (!st.visited[i]) { st.visited[i] = 1; if (st.hearts < 4) { st.hearts++; gift = 'heart'; } else if (st.seeds < seedMax()) { st.seeds = Math.min(seedMax(), st.seeds + 2); gift = 'seed'; } }
  st.visit = { i, res, t: 0, gift }; st.screen = 'visit'; for (const p of P) Object.assign(p.keys, mkKeys());
  beep(880, .1, 'triangle'); setTimeout(() => beep(660, .12, 'triangle'), 140); // Klopf klopf
}
function leaveVisit() { st.screen = 'play'; st.visit = null; say('Tschüss! Komm bald wieder!'); }
// Schlafenszeit: nachts geht die Blume ins Bett, am Morgen weckt sie das Schweinchen
function goToBed() {
  st.screen = 'home'; st.homeMode = 'night'; st.homeFrom = 'night'; st.nightBack = false; st.sleepT = 0; st.nightHeartT = 0; st.crowed = false;
  st.leaves = []; st.rain = null; st.jet = null; for (const p of P) Object.assign(p.keys, mkKeys());
  beep(523, .3, 'sine', .08); setTimeout(() => beep(392, .4, 'sine', .08), 300);
}
function crow() { [[180, 140], [200, 150], [0, 0], [170, 130], [210, 150]].forEach(([a, b], k) => { if (a) setTimeout(() => beep(a, .16, 'sawtooth', .09, b - a), k * 190); }); } // Oink oink!
// Schatzkisten: in jedem Land ist eine versteckt
const TREASURES = [['eine goldene Eichel', '#e0a020'], ['ein Glitzer-Marienkäfer', '#ff4f6d'], ['eine Perle', '#f4f0ff'], ['ein goldener Kaktus', '#ffd23f'], ['eine Kristall-Schneeflocke', '#bfe6ff'],
  ['eine Party-Krone', '#ff8ad8'], ['ein Regenbogenstein', '#b58cff'], ['ein Riesen-Bonbon', '#ff7bb5'], ['eine Dose Sternenstaub', '#fff3a0'], ['eine Schatz-Muschel', '#ffb3c8'], ['ein goldener Schlüssel', '#ffc233']];
// Eigener Garten hinter dem Blumenhaus: Samen einpflanzen, gießen, wachsen lassen
const GARDEN_KINDS = ['gaensebluemchen', 'loewenzahn', 'hibiskus', 'kaktusbluete', 'schneegloeckchen', 'regenbogenblume', 'zuckerblume', 'mondblume', 'seerose', 'sonnenblume'];
const GROW = 60; // Sekunden, bis eine Blume blüht
let garden = [null, null, null, null, null, null];
try { const g = JSON.parse(localStorage.getItem('blumen-garten') || 'null'); if (Array.isArray(g)) garden = g.concat([null, null, null, null, null, null]).slice(0, 6); } catch (e) {}
function saveGarden() { try { localStorage.setItem('blumen-garten', JSON.stringify(garden)); } catch (e) {} }
function plotAge(g) { return (Date.now() - g.at) / 1000 + (g.boost || 0); }
function gardenAction(id) {
  if (id === 'back') { st.homeMode = 'menu'; beep(500, .08); return; }
  if (id === 'water') {
    let any = false; for (const g of garden) if (g && plotAge(g) < GROW) { g.boost = (g.boost || 0) + 8; any = true; }
    saveGarden(); st.waterT = 1.2; beep(400, .3, 'sine', .06, 300);
    say(any ? 'Plitsch, platsch! Die Pflanzen wachsen schneller.' : 'Pflanz zuerst einen Samen ein!'); return;
  }
  if (id && id.startsWith('plot')) {
    const i = +id.slice(4), g = garden[i];
    if (!g) {
      if (st.seeds <= 0) { say('Du hast keine Samen. Sammle draußen welche!'); beep(200, .15, 'triangle'); return; }
      st.seeds--; garden[i] = { at: Date.now(), kind: GARDEN_KINDS[Math.floor(Math.random() * GARDEN_KINDS.length)], boost: 0 }; saveGarden();
      sfx.dig(); say('Eingepflanzt! Gieß ihn mit der Gießkanne, dann wächst er schneller.');
    } else if (plotAge(g) < GROW) say('Die Pflanze wächst noch. Ein bisschen Geduld!');
    else if (!g.harvested) { g.harvested = 1; saveGarden(); st.seeds = Math.min(seedMax(), st.seeds + 2); sfx.star(); say('Sie blüht! Die Blume schenkt dir 2 neue Samen. Tippe nochmal, dann pflückst du sie.'); }
    else { garden[i] = null; saveGarden(); [988, 1318].forEach((f, k) => setTimeout(() => beep(f, .12, 'triangle'), k * 90)); say('Gepflückt! Ein schöner Blumenstrauß. Das Beet ist wieder frei.'); }
  }
}
// Jahreszeiten: jeden Morgen kommt die nächste
const SEASONS = ['Frühling', 'Sommer', 'Herbst', 'Winter'];
st.season = 0; try { st.season = (+localStorage.getItem('blumen-jahreszeit') || 0) % 4; } catch (e) {}
function nextSeason() { st.season = (st.season + 1) % 4; try { localStorage.setItem('blumen-jahreszeit', String(st.season)); } catch (e) {} }
// Spielzimmer mit Puzzle
const MOTIFS = ['Blumenhaus', 'Krakenkönig', 'Blumen-City', 'Regenbogen'];
function newPuzzle(m) {
  const order = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  do { for (let i = 8; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } } while (order.every((v, i) => v === i));
  st.puz = { m: m == null ? ((st.puz ? st.puz.m : -1) + 1) % MOTIFS.length : m, order, sel: -1, solved: false, t: 0 };
}
function puzzleAction(id) {
  if (id === 'back') { st.homeMode = 'menu'; beep(500, .08); return; }
  if (id === 'pnew') { newPuzzle(); beep(700, .08); say('Ein neues Puzzle: ' + MOTIFS[st.puz.m] + '!'); return; }
  const P2 = st.puz; if (!P2 || P2.solved || !id || !id.startsWith('pc')) return;
  const i = +id.slice(2);
  if (P2.sel < 0) { P2.sel = i; beep(800, .06); return; }
  if (P2.sel === i) { P2.sel = -1; return; }
  [P2.order[P2.sel], P2.order[i]] = [P2.order[i], P2.order[P2.sel]]; P2.sel = -1; beep(600, .08, 'triangle');
  if (P2.order.every((v, k) => v === k)) { P2.solved = true; P2.t = 0; st.seeds = Math.min(seedMax(), st.seeds + 2); sfx.star(); say('Super! Das Puzzle ist fertig! Du bekommst 2 Samen.'); }
}
// Musikzimmer: Klavier mit 8 bunten Tasten
const PIANO = [['C', 262, '#ff6b6b'], ['D', 294, '#ffb347'], ['E', 330, '#ffe66b'], ['F', 349, '#7ee081'], ['G', 392, '#6fc3ff'], ['A', 440, '#b58cff'], ['H', 494, '#ff8ad8'], ['C', 523, '#ff6b6b']];
const SONG_ENTCHEN = [0, 1, 2, 3, 4, 4, 5, 5, 5, 5, 4, 5, 5, 5, 5, 4, 3, 3, 3, 3, 2, 2, 1, 1, 1, 1, 0];
function playKey(i) { beep(PIANO[i][1], .45, 'triangle', .14); beep(PIANO[i][1] * 2, .25, 'sine', .04); st.piano = st.piano || { hit: [], notes: [] }; st.piano.hit[i] = performance.now(); st.piano.notes.push({ i, t: 0 });
  if (st.follow != null && !st.demo && i === SONG_ENTCHEN[st.follow]) { st.follow++; if (st.follow >= SONG_ENTCHEN.length) { st.follow = null; setTimeout(() => sfx.star(), 400); say('Bravo! Du hast Alle meine Entchen gespielt!'); } }
}
function musicAction(id) {
  if (id === 'back') { st.homeMode = 'menu'; st.demo = null; beep(500, .08); return; }
  if (id === 'demo') { st.demo = { k: 0, t: 0.4 }; say('Hör gut zu: Alle meine Entchen! Danach kannst du es nachspielen.'); return; }
  if (id && id.startsWith('key')) playKey(+id.slice(3));
}
// Schneemann bauen: im Winter (und am Schneeberg) liegen Schneehaufen herum
function buildSnow(i) {
  const sn = st.snow[i]; if (!sn || sn.stage >= 3) return;
  sn.stage++; beep(500 + sn.stage * 150, .12, 'triangle'); for (let k = 0; k < 10; k++) st.sparkles.push(spark(sn.x, groundY(sn.x) - 20 * S * sn.stage, '#ffffff'));
  if (sn.stage === 3) { st.seeds = Math.min(seedMax(), st.seeds + 1); sfx.star(); say('Fertig! Ein Schneemann! Er schenkt dir einen Samen.'); }
  else say(sn.stage === 1 ? 'Eine dicke Schneekugel! Drück nochmal ⬆.' : 'Noch der Kopf! Drück nochmal ⬆.');
}
// Eigene Farben für die Blüten (pro Blume), mit Knopf zurück zur echten Farbe
const COLORS = [['Rosa', '#ff6fae', '#ff9ec7', '#e03b7d'], ['Lila', '#b06bff', '#d4a6ff', '#7a3ad0'], ['Blau', '#5aa8ff', '#9fd0ff', '#2f6fd0'], ['Türkis', '#2fd0c0', '#8ff0e4', '#1a9a8e'],
  ['Gelb', '#ffc233', '#ffe08a', '#d99a00'], ['Orange', '#ff8a3a', '#ffb37a', '#d9601a'], ['Rot', '#ff3b3b', '#ff7a7a', '#c4141f'], ['Weiß', '#ffffff', '#f4f0ff', '#c9c0dd']];
st.colors = {}; try { st.colors = JSON.parse(localStorage.getItem('blumen-farbe') || '{}') || {}; } catch (e) {}
function saveColors() { try { localStorage.setItem('blumen-farbe', JSON.stringify(st.colors)); } catch (e) {} }
// Luftballon-Fahrt: in jedem Land wartet ein Ballon, mit dem man ein Stück fliegt
const RIDE = 7;
function rideHeight(t) { return (t < 1.2 ? t / 1.2 : t > RIDE - 1.2 ? (RIDE - t) / 1.2 : 1) * 210 * S; }
function startRide() { const b = st.balloon; if (!b || b.used) return; b.used = true; st.ride = { t: 0, x: leadX() }; for (const p of players()) p.x = st.ride.x - (p.id ? 30 : 0);
  say('Los geht\'s! Der Ballon fliegt dich ein Stück über das Land.'); [523, 659, 784].forEach((f, k) => setTimeout(() => beep(f, .2, 'triangle', .1), k * 120)); }
// Hündchen im Blumenhaus
st.dog = { mode: 'idle', t: 0, ballX: 0 };
function dogAction(id) {

  st.helperTalk = nearHelper ? Math.min(1, st.helperTalk + dt * 3) : Math.max(0, st.helperTalk - dt * 3);
  if (nearHelper && !st.helperMet) { st.helperMet = true; st.checkpoint = st.helperX; saveGame(); beep(990, .1); setTimeout(() => beep(1200, .12), 90); }
  // Blumenfee: anfassen, dann schenkt sie einen Zauber
  const F = st.fairy;
  if (F) { F.t += dt;
    if (!F.got && ps.some(p => Math.abs(p.x - F.x) < 70 && p.digging < 0.5)) {
      F.got = true; const pw = POWER[F.kind];
      if (F.kind === 'herz') { st.hearts = 4; st.power = { kind: 'herz', t: 2.5, max: 2.5 }; }
      else st.power = { kind: F.kind, t: pw.dur, max: pw.dur };
      say('Die Blumenfee schenkt dir ' + pw.say); st.msgT = 4;
      [1046, 1318, 1568, 2093].forEach((f, k) => setTimeout(() => beep(f, .18, 'triangle', .1), k * 90));
      for (let k = 0; k < 30; k++) st.sparkles.push(spark(F.x, groundY(F.x) - 130 * S, [pw.c, '#fff6a0', '#ffffff'][k % 3]));
    } }
  const C = st.chest;
  if (C) { C.t += dt;
    if (!C.open && ps.some(p => Math.abs(p.x - C.x) < 50 && p.digging < 0.5 && p.jumpY < 30 * S)) {
      C.open = true; C.t = 0; const tr = TREASURES[st.world] || TREASURES[0], neu = !album.chest[st.world];
      album.chest[st.world] = 1; saveAlbum(); st.seeds = Math.min(seedMax(), st.seeds + 3); if (st.hearts < 4) st.hearts++;
      say('Eine Schatzkiste! Darin ist ' + tr[0] + '! Und 3 Samen.' + (neu ? ' Der Schatz ist jetzt im Album.' : '')); st.msgT = 5;
      [784, 988, 1175, 1568, 1976].forEach((f, k) => setTimeout(() => beep(f, .15, 'triangle', .1), k * 80));
      for (let k = 0; k < 30; k++) st.sparkles.push(spark(C.x, groundY(C.x) - 30 * S, ['#ffd23f', '#fff6a0', tr[1]][k % 3]));
    } }
  if (st.power) { st.power.t -= dt;
    if (st.power.t <= 0) { if (st.power.kind !== 'herz') say('Der ' + POWER[st.power.kind].name + ' ist vorbei.'); st.power = null; } }
  // Samenmagnet: Samen in der Nähe fliegen zu dir
  if (hasPower('magnet') && st.seeds < seedMax()) for (const sd of st.seedsOnMap) { if (sd.got) continue;
    const p = ps.reduce((a, b) => Math.abs(b.x - sd.x) < Math.abs(a.x - sd.x) ? b : a);
    if (Math.abs(p.x - sd.x) < 600) { sd.x += Math.sign(p.x - sd.x) * Math.min(Math.abs(p.x - sd.x), 520 * dt); sd.up += (70 - sd.up) * Math.min(1, dt * 3); } }

  // Samen einsammeln (die Samen gehören allen zusammen)
  for (const sd of st.seedsOnMap) {
    sd.t += dt;
    if (sd.got) continue;
    const sy = groundY(sd.x) - sd.up * S;
    for (const p of ps) {
      const py = groundY(p.x) - p.jumpY;
      if (!sd.got && Math.abs(sd.x - p.x) < 40 * S && Math.abs(sy - (py - 70 * S)) < 70 * S && p.digging < 0.5 && st.seeds < seedMax()) {
        sd.got = true; st.seeds++; sfx.seed();
        for (let i = 0; i < 14; i++) st.sparkles.push(spark(sd.x, sy, i % 2 ? '#e0aaff' : '#fff6a0'));
        if (st.seeds === seedMax()) say(seedMax() + ' Samen! Die Tasche ist voll.');
      }
    }
  }

  // Gegner: kommen nur selten
  st.leafTimer -= dt;
  const lead = leadX();
  const safeZone = st.world === 0 && lead < 1000; // im Blumendorf ist es sicher
  if (w.foes.length && st.leafTimer <= 0 && !st.storm && !(B && !B.defeated && B.x - lead < W * 1.5) && lead < w.len - 500 && !safeZone && Math.abs(lead - st.helperX) > 400) {
    const type = w.foes[Math.floor(Math.random() * w.foes.length)];
    const base = type === 'leaf' ? 95 : 80;
    st.leaves.push({ type, x: st.camX + W + 60, t: Math.random() * 6, sp: (base + Math.random() * 40 + st.world * 6) * S, hit: false });
    st.leafTimer = (st.two ? 6 : 7) + Math.random() * 6;
  }
  for (const L of st.leaves) {
    L.x -= L.sp * dt; L.t += dt;
    L.y = FLY.has(L.type) ? groundY(L.x) - (40 + Math.sin(L.t * 3) * 8) * S : groundY(L.x);
    if (L.hit) continue;
    for (const p of ps) {
      if (p.digging > 0.7 || p.hurt > 0 || st.ride) continue;
      const py = groundY(p.x) - p.jumpY;
      const touching = FLY.has(L.type)
        ? Math.abs(L.x - p.x) < 34 * S && L.y > py - 115 * S * (1 - p.digging * 0.9) && L.y < py + 5
        : Math.abs(L.x - p.x) < 38 * S && p.jumpY < 62 * S;
      if (touching && hasPower('schild')) { // die Schutzblase schubst den Gegner weg
        L.hit = true; beep(880, .12, 'sine', .1, 400); for (let k = 0; k < 10; k++) st.sparkles.push(spark(p.x, py - 60 * S, k % 2 ? '#6fd3ff' : '#ffffff')); break; }
      if (touching) {
        L.hit = true; p.hurt = 1.6; st.hearts--; sfx.hurt();
        if (st.hearts <= 0) { goHome('die'); return; }
        say(st.two ? 'Autsch, ' + nameOf(p) + '! Grab dich ein oder hüpf drüber!' : 'Autsch! Grab dich ein (⬇) oder hüpf drüber (⬆)!');
        break;
      }
    }
  }
  st.leaves = st.leaves.filter(L => L.x > st.camX - 100);
  for (const o of st.obst) o.t += dt;

  // Regen: ab und zu regnet es, dann wachsen die kleinen Blumen am Boden
  if (!st.rain && !st.storm && w.deco !== 'wasser' && w.deco !== 'schnee') {
    st.rainT -= dt;
    if (st.rainT <= 0) { st.rain = { t: 0, dur: 16 }; say('Es regnet! Schau mal, die Blumen wachsen!'); }
  }
  if (st.rain) { st.rain.t += dt; st.grow = Math.min(2.4, st.grow + dt * 0.05);
    if (st.rain.t > st.rain.dur) { st.rain = null; st.rainT = 50 + Math.random() * 50; st.rainbowT = 10; say('Der Regen ist vorbei. Da, ein Regenbogen!'); } }
  if (st.rainbowT > 0) st.rainbowT -= dt;
  // Schneesturm am Schneeberg: eingraben oder ins Blumenhaus, sonst wird es kalt
  if (st.stormAt && !st.storm && lead > st.stormAt) {
    st.storm = { t: 0, warn: 4, dur: 14, cold: [0, 0] }; st.stormAt = null;
    say('Achtung, ein Schneesturm kommt! Grab dich ein oder lauf zum Geheimgang ins Blumenhaus!');
    if (st.seeds < (st.two ? 2 : 1)) { st.seeds = st.two ? 2 : 1; setTimeout(() => say('Summsi bringt dir einen Samen zum Eingraben!'), 3000); }
    beep(300, 0.8, 'sawtooth', 0.04, -150);
  }
  if (st.storm) {
    const sm = st.storm; sm.t += dt;
    if (sm.t > sm.warn + sm.dur) { st.storm = null; say('Der Schneesturm ist vorbei!'); sfx.star(); }
    else if (sm.t > sm.warn) for (const p of ps) {
      if (p.digging > 0.7 || hasPower('schild')) { sm.cold[p.id] = Math.max(0, sm.cold[p.id] - dt); continue; }
      sm.cold[p.id] += dt;
      if (sm.cold[p.id] >= 3) { sm.cold[p.id] = 0; p.hurt = 1; st.hearts--; sfx.hurt();
        if (st.hearts <= 0) { goHome('die'); return; }
        say('Brrr, ist das kalt! Grab dich ein!'); }
    }
  }

  // bunter Blumen-Jet saust ab und zu über den Himmel
  st.jetTimer = (st.jetTimer == null ? 6 : st.jetTimer) - dt;
  if (!st.jet && st.jetTimer <= 0 && WORLDS[st.world].deco !== 'wasser') {
    const dir = Math.random() < 0.5 ? 1 : -1;
    st.jet = { giftAt: Math.random() < 0.75 ? W * (0.3 + Math.random() * 0.4) : null, dir, x: dir > 0 ? -120 : W + 120, y: H * (0.2 + Math.random() * 0.12), trail: [], t: 0 };
    st.jetTimer = 14 + Math.random() * 12;
    beep(900, 1.2, 'sawtooth', 0.025, -600); beep(1350, 1.0, 'triangle', 0.02, -700);
  }
  if (st.jet) {
    const J = st.jet; J.t += dt; J.x += J.dir * W * 0.45 * dt;
    J.trail.push({ x: J.x - J.dir * 70 * S, y: J.y + Math.sin(J.t * 4) * 6 * S, a: 1 });
    for (const q of J.trail) q.a -= dt * 0.35;
    J.trail = J.trail.filter(q => q.a > 0);
    // Geschenk abwerfen, wenn der Jet ungefähr in der Mitte ist
    if (!J.dropped && J.giftAt != null && (J.dir > 0 ? J.x >= J.giftAt : J.x <= J.giftAt)) {
      J.dropped = true;
      const type = st.hearts < 4 && Math.random() < 0.45 ? 'heart' : 'seed';
      st.gifts.push({ x: st.camX + J.x, y: J.y + 20 * S, vy: 0, type, t: 0, landed: false });
      beep(1320, .1, 'triangle'); setTimeout(() => beep(1760, .12, 'triangle'), 90);
    }
    if ((J.dir > 0 && J.x > W + 150) || (J.dir < 0 && J.x < -150)) { if (!J.trail.length) st.jet = null; }
  }

  // Geschenke vom Jet schweben am Blumen-Fallschirm herunter
  for (const g of st.gifts) {
    g.t += dt;
    const gy = groundY(g.x) - 18 * S;
    if (!g.landed) { g.y += 70 * S * dt; g.x += Math.sin(g.t * 2) * 20 * S * dt; if (g.y >= gy) { g.y = gy; g.landed = true; } }
    for (const p of ps) {
      const py = groundY(p.x) - p.jumpY;
      if (!g.got && Math.abs(g.x - p.x) < 45 * S && g.y > py - 160 * S && p.digging < 0.5) {
        if (g.type === 'heart' && st.hearts < 4) { g.got = true; st.hearts++; say('Ein Herz vom Blumen-Jet!'); }
        else if (st.seeds < seedMax()) { g.got = true; st.seeds = Math.min(seedMax(), st.seeds + 2); say('Zwei Samen vom Blumen-Jet!'); }
        if (g.got) { sfx.seed(); for (let k = 0; k < 16; k++) st.sparkles.push(spark(g.x, g.y, k % 2 ? '#ff9ec7' : '#fff6a0')); }
      }
    }
  }
  st.gifts = st.gifts.filter(g => !g.got && g.x > st.camX - 200 && g.t < 60);

  // Glitzer
  for (const p of st.sparkles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.t -= dt; }
  st.sparkles = st.sparkles.filter(p => p.t > 0);

  // Ziel erreicht
  if (lead >= w.len - 20) {
    st.msgT = 0; st.screenT = 0; sfx.star(); album.star[st.world] = 1; saveAlbum();
    if (st.world === WORLDS.length - 1) { st.screen = 'win'; clearGame(); } else { gotStar(); st.screen = 'star'; try { localStorage.setItem('blumen-spielstand', JSON.stringify({ world: st.world + 1, at: 140, stars: st.stars, seeds: st.seeds })); } catch (e) {} }
  }
}

/* ---------- Malen ---------- */
function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, h, r) : cx.rect(x, y, w, h); }
function circle(x, y, r, c) { cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fillStyle = c; cx.fill(); }

function drawFace(x, y, r, kind, mood) {
  // Augen
  const ex = r * 0.33, ey = y - r * 0.05;
  if (mood === 'sleep') {
    cx.strokeStyle = '#2b1a2f'; cx.lineWidth = Math.max(1.5, r * 0.06); cx.lineCap = 'round';
    for (const sx of [-1, 1]) { cx.beginPath(); cx.arc(x + sx * ex, ey, r * 0.13, Math.PI * 0.1, Math.PI * 0.9); cx.stroke(); }
    circle(x - r * 0.55, y + r * 0.22, r * 0.12, '#ff7aa8aa'); circle(x + r * 0.55, y + r * 0.22, r * 0.12, '#ff7aa8aa');
    circle(x, y + r * 0.35, r * 0.1, '#7a1f3d');
    return;
  }
  for (const sx of [-1, 1]) {
    circle(x + sx * ex, ey, r * 0.17, '#fff');
    circle(x + sx * ex + r * 0.03, ey + r * 0.02, r * 0.11, '#2b1a2f');
    circle(x + sx * ex + r * 0.07, ey - r * 0.04, r * 0.04, '#fff');
    if (kind === 'rose') { // Wimpern
      cx.strokeStyle = '#2b1a2f'; cx.lineWidth = Math.max(1, r * 0.04);
      for (const a of [-0.5, 0, 0.5]) { cx.beginPath(); cx.moveTo(x + sx * ex + a * r * 0.15, ey - r * 0.16); cx.lineTo(x + sx * ex + a * r * 0.3, ey - r * 0.28); cx.stroke(); }
    }
  }
  // Bäckchen
  circle(x - r * 0.55, y + r * 0.22, r * 0.12, '#ff7aa8aa');
  circle(x + r * 0.55, y + r * 0.22, r * 0.12, '#ff7aa8aa');
  // Mund
  cx.strokeStyle = '#7a1f3d'; cx.lineWidth = Math.max(1.5, r * 0.07); cx.lineCap = 'round';
  cx.beginPath();
  if (mood === 'sad') cx.arc(x, y + r * 0.45, r * 0.2, Math.PI * 1.15, Math.PI * 1.85);
  else cx.arc(x, y + r * 0.15, r * 0.25, Math.PI * 0.15, Math.PI * 0.85);
  cx.stroke();
}

// Jede Blume hat ihre eigene tolle Tasche für die Samen
const BAGS = { tulpe: ['#c77dff', '#a64dff', 'heart'], rose: ['#ff4f6d', '#d62f4f', 'star'], sonnenblume: ['#36b6f0', '#1f8fc4', 'flower'], mohn: ['#5cc85c', '#3a9a40', 'bug'] };
function drawBag(x, y, stemH, s, kind, seeds) {
  const [c1, c2, deco] = BAGS[kind];
  const sx = x - 3 * s, sy = y - stemH * 0.78, bx = x + 16 * s, by = y - stemH * 0.32, bw = 24 * s, bh = 19 * s;
  cx.strokeStyle = c2; cx.lineWidth = 2.2 * s; cx.lineCap = 'round'; // Riemen
  cx.beginPath(); cx.moveTo(sx, sy); cx.quadraticCurveTo(bx + 4 * s, sy + 6 * s, bx + bw * 0.35, by - bh / 2); cx.stroke();
  cx.beginPath(); cx.moveTo(sx, sy); cx.lineTo(bx - bw * 0.35, by - bh / 2); cx.stroke();
  // Samen gucken raus
  for (let i = 0; i < Math.min(3, seeds); i++) { cx.fillStyle = '#9b4dff'; cx.beginPath(); cx.ellipse(bx - 6 * s + i * 6 * s, by - bh / 2 - 2 * s, 3 * s, 4.5 * s, (i - 1) * 0.4, 0, 7); cx.fill(); }
  cx.fillStyle = c1; rr(bx - bw / 2, by - bh / 2, bw, bh, 6 * s); cx.fill();
  cx.fillStyle = c2; cx.beginPath(); cx.moveTo(bx - bw / 2, by - bh / 2 + 2 * s); cx.lineTo(bx + bw / 2, by - bh / 2 + 2 * s); cx.quadraticCurveTo(bx, by + bh * 0.25, bx - bw / 2, by - bh / 2 + 2 * s); cx.fill(); // Klappe
  const ex = bx, ey = by + bh * 0.12;
  if (deco === 'heart') { cx.fillStyle = '#ffd6f0'; cx.beginPath(); cx.moveTo(ex, ey + 4 * s); cx.bezierCurveTo(ex - 7 * s, ey - 1 * s, ex - 3 * s, ey - 6 * s, ex, ey - 2.5 * s); cx.bezierCurveTo(ex + 3 * s, ey - 6 * s, ex + 7 * s, ey - 1 * s, ex, ey + 4 * s); cx.fill(); }
  else if (deco === 'star') star5(ex, ey, 5 * s, '#ffd23f');
  else if (deco === 'bug') { circle(ex, ey, 5 * s, '#e8222e'); circle(ex, ey - 4.5 * s, 2.4 * s, '#222'); cx.fillStyle = '#222'; cx.fillRect(ex - 0.4 * s, ey - 3 * s, 0.8 * s, 8 * s); for (const [dx, dy] of [[-2.4, -0.5], [2.4, -0.5], [-2, 2.6], [2, 2.6]]) circle(ex + dx * s, ey + dy * s, 1.1 * s, '#222'); }
  else { for (let i = 0; i < 5; i++) { const a = i * 1.2566; circle(ex + Math.cos(a) * 3 * s, ey + Math.sin(a) * 3 * s, 2.4 * s, '#fff'); } circle(ex, ey, 1.8 * s, '#ffd23f'); }
  star4(bx + bw / 2 - 2 * s, by - bh / 2 + 2 * s, 1.6 * s * (1 + Math.sin(performance.now() / 300 + x)), '#fff6c0'); // Glitzer
}

// Belohnungen: für jeden Stern gibt es etwas zum Anziehen
const WEAR = [
  { id: 'schleife', name: 'Schleife', stars: 1 },
  { id: 'brille', name: 'Sonnenbrille', stars: 2 },
  { id: 'hut', name: 'Sonnenhut', stars: 3 },
  { id: 'krone', name: 'Krone', stars: 4 },
  { id: 'fluegel', name: 'Glitzerflügel', stars: 5 },
];
let unlocked = 0; st.wear = [null, null];
try { unlocked = +(localStorage.getItem('blumen-sterne') || 0); st.wear = JSON.parse(localStorage.getItem('blumen-wear') || '[null,null]'); } catch (e) {}
function saveWear() { try { localStorage.setItem('blumen-sterne', String(unlocked)); localStorage.setItem('blumen-wear', JSON.stringify(st.wear)); } catch (e) {} }
function gotStar() {
  st.stars = Math.min(WORLDS.length - 1, st.stars + 1);
  st.newWear = null;
  if (st.stars > unlocked) { unlocked = st.stars; const it = WEAR[unlocked - 1]; if (it) { st.newWear = it; st.wear = [it.id, it.id]; } saveWear(); }
}

function drawWings(x, y, s, t) {
  const flap = 0.75 + Math.sin(t * 8) * 0.25;
  for (const d of [-1, 1]) {
    cx.save(); cx.translate(x, y); cx.scale(d * flap, 1);
    const g = cx.createLinearGradient(0, -30 * s, 40 * s, 10 * s); g.addColorStop(0, '#8fd6ffdd'); g.addColorStop(1, '#ff9ee0dd');
    cx.fillStyle = g; cx.beginPath(); cx.ellipse(22 * s, -16 * s, 26 * s, 15 * s, -0.5, 0, 7); cx.fill();
    cx.beginPath(); cx.ellipse(18 * s, 10 * s, 17 * s, 10 * s, 0.5, 0, 7); cx.fill();
    cx.strokeStyle = '#ffffffcc'; cx.lineWidth = 1.5 * s; cx.stroke();
    cx.restore();
  }
  for (let i = 0; i < 3; i++) star4(x + Math.cos(t * 3 + i * 2) * 40 * s, y - 10 * s + Math.sin(t * 3 + i * 2) * 20 * s, 2.5 * s, '#fff6c0');
}
function drawWear(id, bx, by, r, kind, t) {
  const s = r / 30, top = by - r * ({ tulpe: 1.3, rose: 1.2, sonnenblume: 1.45, mohn: 1.35 }[kind]);
  const fy = by + (kind === 'tulpe' ? r * 0.15 : r * 0.1), fr = r * 0.8; // Gesicht
  if (id === 'schleife') {
    const x = bx + r * 0.75, y = top + r * 0.35;
    cx.fillStyle = '#ff3d8b';
    cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - 14 * s, y - 9 * s); cx.lineTo(x - 14 * s, y + 9 * s); cx.fill();
    cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + 14 * s, y - 9 * s); cx.lineTo(x + 14 * s, y + 9 * s); cx.fill();
    circle(x, y, 4.5 * s, '#ff7ab3');
  } else if (id === 'brille') {
    const ex = fr * 0.33, ey = fy - fr * 0.05;
    cx.fillStyle = '#2b1a2fee'; for (const d of [-1, 1]) { rr(bx + d * ex - 9 * s, ey - 7 * s, 18 * s, 13 * s, 5 * s); cx.fill(); }
    cx.strokeStyle = '#2b1a2f'; cx.lineWidth = 2.5 * s; cx.beginPath(); cx.moveTo(bx - ex + 9 * s, ey - 2 * s); cx.lineTo(bx + ex - 9 * s, ey - 2 * s); cx.stroke();
    circle(bx - ex - 3 * s, ey - 3 * s, 2 * s, '#ffffffaa'); circle(bx + ex - 3 * s, ey - 3 * s, 2 * s, '#ffffffaa');
  } else if (id === 'hut') {
    cx.fillStyle = '#f2d27a'; cx.beginPath(); cx.ellipse(bx, top + 4 * s, r * 1.15, 8 * s, -0.08, 0, 7); cx.fill();
    cx.fillStyle = '#e8c35f'; cx.beginPath(); cx.ellipse(bx, top - 4 * s, r * 0.55, 15 * s, 0, Math.PI, 0); cx.fill();
    cx.fillStyle = '#ff6fae'; cx.fillRect(bx - r * 0.55, top - 4 * s, r * 1.1, 5 * s);
    circle(bx + r * 0.45, top - 3 * s, 5 * s, '#ffd23f'); circle(bx + r * 0.45, top - 3 * s, 2 * s, '#ff8a5c');
  } else if (id === 'krone') {
    const w = r * 0.9, y = top + 6 * s;
    cx.fillStyle = '#ffd23f'; cx.beginPath(); cx.moveTo(bx - w / 2, y); cx.lineTo(bx - w / 2, y - 18 * s); cx.lineTo(bx - w / 4, y - 8 * s); cx.lineTo(bx, y - 22 * s);
    cx.lineTo(bx + w / 4, y - 8 * s); cx.lineTo(bx + w / 2, y - 18 * s); cx.lineTo(bx + w / 2, y); cx.fill();
    circle(bx, y - 6 * s, 3.5 * s, '#ff4f6d'); circle(bx - w / 3, y - 5 * s, 2.5 * s, '#6fd3ff'); circle(bx + w / 3, y - 5 * s, 2.5 * s, '#9be07a');
    star4(bx + w / 2, y - 18 * s, (1.5 + Math.abs(Math.sin(t * 4))) * s, '#fff');
  }
}

function drawFlower(x, y, kind, size, opts = {}) {
  // x,y = Fuß der Blume am Boden
  const s = size, stemH = 80 * s, bob = opts.bob || 0, lean = opts.lean || 0;
  const stemCol = kind === 'rose' ? '#1f6b34' : kind === 'sonnenblume' ? '#3f9a3a' : '#4caf50';
  const leafCol = kind === 'rose' ? '#2e8b4a' : kind === 'sonnenblume' ? '#5cb84f' : '#66c96a';
  const topX = x + lean * 10 * s, topY = y - stemH + bob;
  cx.save();
  if (opts.alpha != null) cx.globalAlpha = opts.alpha;
  if (opts.wear === 'fluegel') drawWings(topX, topY + 28 * s, s * 1.5, performance.now() / 1000);
  // Stiel
  cx.strokeStyle = stemCol; cx.lineWidth = 7 * s; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(x, y); cx.quadraticCurveTo(x - 8 * s, y - stemH * 0.5, topX, topY); cx.stroke();

  const s = S, sq = Math.sin(t * 8) * 0.08;
  cx.fillStyle = '#ff7bb5'; cx.beginPath(); cx.ellipse(x, y - 30 * s * (1 - sq), 32 * s * (1 + sq), 30 * s * (1 - sq), 0, 0, 7); cx.fill();
  for (const d of [-20, -6, 10, 22]) { cx.beginPath(); cx.ellipse(x + d * s, y - 2 * s, 6 * s, (5 + Math.abs(Math.sin(t * 6 + d)) * 4) * s, 0, 0, 7); cx.fill(); } // Klebefäden
  circle(x - 12 * s, y - 42 * s, 7 * s, '#fff'); circle(x + 10 * s, y - 42 * s, 7 * s, '#fff'); circle(x - 13 * s, y - 41 * s, 3.5 * s, '#300'); circle(x + 9 * s, y - 41 * s, 3.5 * s, '#300');
  cx.strokeStyle = '#7a1f5c'; cx.lineWidth = 3.5 * s; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(x - 21 * s, y - 54 * s); cx.lineTo(x - 6 * s, y - 49 * s); cx.moveTo(x + 19 * s, y - 54 * s); cx.lineTo(x + 4 * s, y - 49 * s); cx.stroke();
  cx.fillStyle = '#ffd1e8'; const b = 6 + Math.abs(Math.sin(t * 2)) * 8; circle(x + 2 * s, y - 22 * s, b * s, '#ffb3d6'); circle(x + 2 * s - b * 0.3 * s, y - 22 * s - b * 0.3 * s, b * 0.25 * s, '#ffffffaa'); // Kaugummiblase
}
// freche Fledermaus (Nachtgarten, fliegt)
function drawBat(x, y, t) {
  const s = S, f = Math.sin(t * 14);
  cx.fillStyle = '#4a3a6a';
  for (const d of [-1, 1]) { cx.beginPath(); cx.moveTo(x + d * 8 * s, y); cx.quadraticCurveTo(x + d * 26 * s, y - 18 * s * f, x + d * 38 * s, y - 6 * s * f); cx.lineTo(x + d * 30 * s, y + 4 * s); cx.lineTo(x + d * 22 * s, y); cx.lineTo(x + d * 14 * s, y + 6 * s); cx.fill(); }
  circle(x, y, 13 * s, '#5a4a7a');
  for (const d of [-1, 1]) { cx.beginPath(); cx.moveTo(x + d * 4 * s, y - 10 * s); cx.lineTo(x + d * 10 * s, y - 22 * s); cx.lineTo(x + d * 12 * s, y - 8 * s); cx.fill(); }
  circle(x - 5 * s, y - 2 * s, 3.5 * s, '#ffe066'); circle(x + 5 * s, y - 2 * s, 3.5 * s, '#ffe066'); circle(x - 5 * s, y - 2 * s, 1.5 * s, '#223'); circle(x + 5 * s, y - 2 * s, 1.5 * s, '#223');
  cx.fillStyle = '#fff'; for (const d of [-3, 2]) { cx.beginPath(); cx.moveTo(x + d * s, y + 5 * s); cx.lineTo(x + (d + 1) * s, y + 9 * s); cx.lineTo(x + (d + 2) * s, y + 5 * s); cx.fill(); }
}
// Hai (Unterwasserwelt, schwimmt)
function drawShark(x, y, t) {
  const s = S, wig = Math.sin(t * 6) * 4 * s;
  cx.fillStyle = '#7d93ad';
  cx.beginPath(); cx.moveTo(x + 40 * s, y - 4 * s + wig); cx.lineTo(x + 58 * s, y - 18 * s + wig); cx.lineTo(x + 54 * s, y + wig); cx.lineTo(x + 58 * s, y + 14 * s + wig); cx.fill(); // Schwanz
  cx.beginPath(); cx.ellipse(x + 5 * s, y, 42 * s, 17 * s, 0, 0, 7); cx.fill();
  cx.beginPath(); cx.moveTo(x - 2 * s, y - 14 * s); cx.lineTo(x + 10 * s, y - 34 * s); cx.lineTo(x + 18 * s, y - 14 * s); cx.fill(); // Flosse
  cx.fillStyle = '#e8eef5'; cx.beginPath(); cx.ellipse(x, y + 7 * s, 34 * s, 8 * s, 0, 0, Math.PI); cx.fill();
  circle(x - 22 * s, y - 5 * s, 4.5 * s, '#fff'); circle(x - 23 * s, y - 4 * s, 2.2 * s, '#123');
  cx.strokeStyle = '#123'; cx.lineWidth = 2.5 * s; cx.beginPath(); cx.moveTo(x - 29 * s, y - 12 * s); cx.lineTo(x - 18 * s, y - 9 * s); cx.stroke();
  cx.fillStyle = '#fff'; cx.beginPath(); cx.moveTo(x - 36 * s, y + 4 * s); for (let k = 0; k < 5; k++) { cx.lineTo(x - 33 * s + k * 5 * s, y + 9 * s); cx.lineTo(x - 30 * s + k * 5 * s, y + 4 * s); } cx.fill();
}
// Qualle (Unterwasserwelt, schwebt)
function drawJelly(x, y, t) {
  const s = S, p = Math.sin(t * 4) * 0.12;
  cx.strokeStyle = '#d98cff99'; cx.lineWidth = 3 * s; cx.lineCap = 'round';
  for (let k = -2; k <= 2; k++) { cx.beginPath(); cx.moveTo(x + k * 7 * s, y); for (let q = 1; q <= 4; q++) cx.lineTo(x + k * 7 * s + Math.sin(t * 5 + q + k) * 4 * s, y + q * 8 * s); cx.stroke(); }
  cx.fillStyle = '#e6a8ffdd'; cx.beginPath(); cx.ellipse(x, y, 22 * s * (1 + p), 20 * s * (1 - p), 0, Math.PI, 0); cx.fill();
  circle(x - 7 * s, y - 8 * s, 2.5 * s, '#5a1745'); circle(x + 7 * s, y - 8 * s, 2.5 * s, '#5a1745');
  cx.strokeStyle = '#5a1745'; cx.lineWidth = 2 * s; cx.beginPath(); cx.arc(x, y - 1 * s, 4 * s, Math.PI * 1.1, Math.PI * 1.9); cx.stroke();
}
function drawSeaMonster(x, y, t) {
  const s = S, sq = Math.sin(t * 7) * 0.06;
  // Tentakel
  cx.strokeStyle = '#2a9d8f'; cx.lineWidth = 7 * s; cx.lineCap = 'round';
  for (let i = 0; i < 5; i++) { const tx0 = x - 24 * s + i * 12 * s; cx.beginPath(); cx.moveTo(tx0, y - 18 * s);
    cx.quadraticCurveTo(tx0 + Math.sin(t * 8 + i) * 10 * s, y - 8 * s, tx0 + Math.sin(t * 8 + i + 1) * 8 * s, y); cx.stroke(); }
  // Rückenzacken
  cx.fillStyle = '#e76f51';
  for (let i = 0; i < 4; i++) { const zx = x - 18 * s + i * 12 * s, zy = y - 66 * s + Math.abs(i - 1.5) * 5 * s; cx.beginPath(); cx.moveTo(zx - 6 * s, zy + 8 * s); cx.lineTo(zx, zy - 10 * s); cx.lineTo(zx + 6 * s, zy + 8 * s); cx.fill(); }
  // Körper
  cx.fillStyle = '#3cc6b4'; cx.beginPath(); cx.ellipse(x, y - 38 * s, 32 * s * (1 + sq), 28 * s * (1 - sq), 0, 0, 7); cx.fill();
  cx.fillStyle = '#9ff0e2'; cx.beginPath(); cx.ellipse(x - 2 * s, y - 28 * s, 18 * s, 12 * s, 0, 0, 7); cx.fill(); // Bauch
  // Flossen
  cx.fillStyle = '#2a9d8f';
  cx.beginPath(); cx.moveTo(x - 30 * s, y - 40 * s); cx.lineTo(x - 50 * s, y - 52 * s + Math.sin(t * 6) * 6 * s); cx.lineTo(x - 44 * s, y - 30 * s); cx.fill();
  cx.beginPath(); cx.moveTo(x + 30 * s, y - 40 * s); cx.lineTo(x + 50 * s, y - 52 * s - Math.sin(t * 6) * 6 * s); cx.lineTo(x + 44 * s, y - 30 * s); cx.fill();
  // ein großes böses Auge
  circle(x, y - 46 * s, 12 * s, '#fff'); circle(x - 2 * s, y - 45 * s, 6 * s, '#1d3557'); circle(x - 4 * s, y - 48 * s, 2 * s, '#fff');
  cx.strokeStyle = '#1d3557'; cx.lineWidth = 3.5 * s; cx.beginPath(); cx.moveTo(x - 14 * s, y - 62 * s); cx.lineTo(x + 12 * s, y - 56 * s); cx.stroke();
  // Mund mit Zähnen
  cx.fillStyle = '#1d3557'; cx.beginPath(); cx.ellipse(x, y - 25 * s, 11 * s, 5 * s, 0, 0, 7); cx.fill();
  cx.fillStyle = '#fff'; for (const d of [-7, -1, 5]) { cx.beginPath(); cx.moveTo(x + d * s, y - 29 * s); cx.lineTo(x + (d + 1.5) * s, y - 24 * s); cx.lineTo(x + (d + 3) * s, y - 29 * s); cx.fill(); }
  // Wassertropfen
  const dp = (t * 1.5) % 1; circle(x + 26 * s, y - 60 * s + dp * 40 * s, 3 * s * (1 - dp), '#8fd8ff');
}

function drawYeti(x, y, t) {
  const s = S, hop = Math.abs(Math.sin(t * 6)) * 6 * s;
  y -= hop;
  // zottelige Wolle
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; circle(x + Math.cos(a) * 26 * s, y - 40 * s + Math.sin(a) * 30 * s, 13 * s, '#f4f8ff'); }
  cx.fillStyle = '#f4f8ff'; cx.beginPath(); cx.ellipse(x, y - 40 * s, 30 * s, 34 * s, 0, 0, 7); cx.fill();
  cx.strokeStyle = '#b9c8e6'; cx.lineWidth = 2 * s; cx.stroke();
  // Arme
  cx.strokeStyle = '#dfe8fa'; cx.lineWidth = 9 * s; cx.lineCap = 'round';
  const wave = Math.sin(t * 6) * 0.5;
  cx.beginPath(); cx.moveTo(x - 26 * s, y - 40 * s); cx.lineTo(x - 44 * s, y - 60 * s - wave * 10 * s); cx.stroke();
  cx.beginPath(); cx.moveTo(x + 26 * s, y - 40 * s); cx.lineTo(x + 44 * s, y - 60 * s + wave * 10 * s); cx.stroke();
  // blaues Gesicht
  cx.fillStyle = '#7fa6e8'; cx.beginPath(); cx.ellipse(x, y - 44 * s, 20 * s, 17 * s, 0, 0, 7); cx.fill();
  circle(x - 8 * s, y - 49 * s, 5 * s, '#fff'); circle(x + 8 * s, y - 49 * s, 5 * s, '#fff');
  circle(x - 9 * s, y - 48 * s, 2.5 * s, '#123'); circle(x + 7 * s, y - 48 * s, 2.5 * s, '#123');
  cx.strokeStyle = '#123'; cx.lineWidth = 3 * s;
  cx.beginPath(); cx.moveTo(x - 16 * s, y - 59 * s); cx.lineTo(x - 4 * s, y - 54 * s); cx.stroke();
  cx.beginPath(); cx.moveTo(x + 16 * s, y - 59 * s); cx.lineTo(x + 4 * s, y - 54 * s); cx.stroke();
  // Mund mit Zähnchen
  cx.fillStyle = '#123'; rr(x - 9 * s, y - 39 * s, 18 * s, 7 * s, 3 * s); cx.fill();
  cx.fillStyle = '#fff'; for (const d of [-5, 3]) { cx.beginPath(); cx.moveTo(x + d * s, y - 39 * s); cx.lineTo(x + (d + 2) * s, y - 35 * s); cx.lineTo(x + (d + 4) * s, y - 39 * s); cx.fill(); }
  // Füße
  cx.fillStyle = '#dfe8fa'; cx.beginPath(); cx.ellipse(x - 12 * s, y - 4 * s, 11 * s, 6 * s, 0, 0, 7); cx.ellipse(x + 12 * s, y - 4 * s, 11 * s, 6 * s, 0, 0, 7); cx.fill();
}

function drawSeed(x, y, t) {
  const s = S, g = 0.5 + Math.sin(t * 5) * 0.5;
  circle(x, y, 18 * s, `rgba(200,120,255,${0.18 + g * 0.2})`);
  cx.fillStyle = '#9b4dff';
  cx.beginPath(); cx.ellipse(x, y, 8 * s, 11 * s, Math.sin(t * 2) * 0.3, 0, Math.PI * 2); cx.fill();
  circle(x - 2.5 * s, y - 4 * s, 2.5 * s, '#e9d2ff');
  for (let i = 0; i < 3; i++) {
    const a = t * 2 + i * 2.1, d = 16 * s;
    star4(x + Math.cos(a) * d, y + Math.sin(a) * d, (2 + g * 3) * s, '#fff6c0');
  }
}
function star4(x, y, r, c) {
  cx.fillStyle = c; cx.beginPath();
  cx.moveTo(x, y - r * 2); cx.lineTo(x + r * 0.5, y - r * 0.5); cx.lineTo(x + r * 2, y); cx.lineTo(x + r * 0.5, y + r * 0.5);
  cx.lineTo(x, y + r * 2); cx.lineTo(x - r * 0.5, y + r * 0.5); cx.lineTo(x - r * 2, y); cx.lineTo(x - r * 0.5, y - r * 0.5); cx.fill();
}
function star5(x, y, r, c, stroke) {
  cx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; cx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  cx.closePath(); cx.fillStyle = c; cx.fill();
  if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = 3; cx.stroke(); }
}
function heart(x, y, r, full) {
  cx.beginPath();
  cx.moveTo(x, y + r * 0.9);
  cx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.4);
  cx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  cx.fillStyle = full ? '#ff3b6b' : '#ffffff55'; cx.fill();
  cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.stroke();
}

function drawHouse(x, y, s, main, noLabel) {
  // Blumenhaus: Pilz-/Blütenhäuschen
  const w = (main ? 150 : 100) * s, h = (main ? 110 : 75) * s;
  cx.fillStyle = main ? '#fff4e0' : '#fdebd3';
  rr(x - w / 2, y - h, w, h, 10 * s); cx.fill();
  // Dach aus Blütenblättern
  const roofC = main ? '#ff6fae' : ['#ffb347', '#8ec5ff', '#c39bff'][Math.floor(x) % 3];
  for (let i = -2; i <= 2; i++) circle(x + i * w * 0.22, y - h - 8 * s + Math.abs(i) * 6 * s, w * 0.2, roofC);
  circle(x, y - h - 26 * s, w * 0.24, roofC);
  circle(x, y - h - 26 * s, w * 0.08, '#ffe066');
  // Tür
  cx.fillStyle = '#a0623a'; rr(x - w * 0.12, y - h * 0.55, w * 0.24, h * 0.55, [w * 0.12, w * 0.12, 0, 0]); cx.fill();
  circle(x + w * 0.06, y - h * 0.27, 2.5 * s, '#ffe066');
  // Fenster
  for (const sx of [-1, 1]) {
    circle(x + sx * w * 0.32, y - h * 0.6, w * 0.1, '#bfe8ff');
    cx.strokeStyle = '#fff'; cx.lineWidth = 2 * s; cx.stroke();
  }
  // Blumen am Haus
  for (let i = 0; i < 5; i++) { const fx = x - w / 2 + 8 * s + i * (w - 16 * s) / 4; circle(fx, y - 6 * s, 6 * s, ['#ff6fae', '#ffd23f', '#c77dff', '#6fd3ff', '#ff8a5c'][i]); circle(fx, y - 6 * s, 2 * s, '#fff'); }
  if (main && !noLabel) {
    cx.fillStyle = '#fff'; cx.font = `bold ${16 * s}px inherit`; cx.textAlign = 'center';
    cx.fillText('Blumenhaus', x, y - h - 60 * s);
  }
}

function drawTree(x, y, s, c1, c2) {
  cx.fillStyle = '#7b4a26'; rr(x - 8 * s, y - 90 * s, 16 * s, 92 * s, 4 * s); cx.fill();
  circle(x, y - 110 * s, 46 * s, c1); circle(x - 30 * s, y - 85 * s, 32 * s, c2); circle(x + 30 * s, y - 88 * s, 34 * s, c1);
}

function decoFar(w, cam, t) {
  const d = w.deco;
  if (d === 'strand') { // Meer
    cx.fillStyle = '#2fa6d8'; cx.fillRect(0, H * 0.5, W, H * 0.3);
    cx.strokeStyle = '#ffffff99'; cx.lineWidth = 2;
    for (let i = 0; i < 6; i++) { const yy = H * 0.53 + i * 18 * S; cx.beginPath(); for (let x = 0; x <= W; x += 20) cx.lineTo(x, yy + Math.sin((x + cam * 0.2) * 0.04 + t * 2 + i) * 3); cx.stroke(); }
    // Boot
    const bx = ((600 - cam * 0.15) % (W + 300) + W + 300) % (W + 300) - 150;
    cx.fillStyle = '#c0392b'; cx.beginPath(); cx.moveTo(bx - 40 * S, H * 0.54); cx.lineTo(bx + 40 * S, H * 0.54); cx.lineTo(bx + 28 * S, H * 0.57); cx.lineTo(bx - 28 * S, H * 0.57); cx.fill();
    cx.fillStyle = '#fff'; cx.beginPath(); cx.moveTo(bx, H * 0.54); cx.lineTo(bx, H * 0.44); cx.lineTo(bx + 28 * S, H * 0.54); cx.fill();
    return;
  }
  if (d === 'schnee') {
    for (let i = -1; i < 6; i++) {
      const mx = i * 340 * S - (cam * 0.15) % (340 * S);
      cx.fillStyle = '#8ea3d6'; cx.beginPath(); cx.moveTo(mx - 200 * S, H * 0.7); cx.lineTo(mx, H * 0.25); cx.lineTo(mx + 200 * S, H * 0.7); cx.fill();
      cx.fillStyle = '#fff'; cx.beginPath(); cx.moveTo(mx - 62 * S, H * 0.39); cx.lineTo(mx, H * 0.25); cx.lineTo(mx + 62 * S, H * 0.39); cx.lineTo(mx + 25 * S, H * 0.36); cx.lineTo(mx, H * 0.4); cx.lineTo(mx - 25 * S, H * 0.36); cx.fill();
    }
  }
  if (d === 'regenbogen') { // großer Regenbogen hinten
    const rx = ((W * 0.45 - cam * 0.08) % (W * 1.6) + W * 1.6) % (W * 1.6) - W * 0.3;
    for (let k = 0; k < 6; k++) { cx.strokeStyle = RAINBOW[k] + 'cc'; cx.lineWidth = 14 * S; cx.beginPath(); cx.arc(rx, H * 0.72, (230 - k * 14) * S, Math.PI, 0); cx.stroke(); }
  }
  if (d === 'wasser') { // Fische schwimmen hinten vorbei
    const now = performance.now() / 1000;
    for (let i = 0; i < 6; i++) { const x = ((i * 300 - cam * 0.25 + now * (40 + i * 8) * S) % (W + 200) + W + 200) % (W + 200) - 100, y = H * (0.25 + (i % 3) * 0.1) + Math.sin(now + i) * 8 * S;
      const c = ['#ffb347', '#ff6fae', '#ffe66b'][i % 3]; cx.fillStyle = c; cx.beginPath(); cx.ellipse(x, y, 14 * S, 8 * S, 0, 0, 7); cx.fill();
      cx.beginPath(); cx.moveTo(x - 12 * S, y); cx.lineTo(x - 22 * S, y - 7 * S); cx.lineTo(x - 22 * S, y + 7 * S); cx.fill(); circle(x + 7 * S, y - 2 * S, 1.8 * S, '#123'); }
  }
  if (d === 'city') { // Blumen-Hochhäuser hinten
    const sp = 120 * S, off = (cam * 0.2) % sp;
    for (let k = -1; k < W / sp + 2; k++) { const idx = k + Math.floor(cam * 0.2 / sp), r = Math.abs(Math.sin(idx * 7.13) * 99) % 1, x = k * sp - off;
      const bw = (60 + r * 30) * S, bh = (140 + r * 150) * S, by = H * 0.68 - bh, col = ['#ffd6ec', '#e3d4ff', '#d4f0ff', '#fff0c4'][Math.abs(idx) % 4];
      rr(x - bw / 2, by, bw, bh + 20 * S, 10 * S); cx.fillStyle = col; cx.fill();
      for (let wy = by + 16 * S; wy < H * 0.66 - 10 * S; wy += 26 * S) for (const wx of [-0.25, 0.25]) { rr(x + wx * bw - 7 * S, wy, 14 * S, 14 * S, 7 * S); cx.fillStyle = (Math.floor(wy / 26 + idx) % 3) ? '#ffffffcc' : '#fff3a0'; cx.fill(); }
      // eine große Blume oben auf dem Dach
      const fc = ['#ff6fae', '#ffd23f', '#c77dff', '#6fd3ff'][Math.abs(idx * 3) % 4], fy = by - 14 * S;
      cx.strokeStyle = '#3a9a40'; cx.lineWidth = 4 * S; cx.beginPath(); cx.moveTo(x, by); cx.lineTo(x, fy); cx.stroke();
      for (let q = 0; q < 6; q++) { const a = q * Math.PI / 3 + t * 0.3; circle(x + Math.cos(a) * 11 * S, fy + Math.sin(a) * 11 * S, 8 * S, fc); }
      circle(x, fy, 7 * S, '#fff3a0'); }
  }
  // ferne Hügel
  cx.fillStyle = w.hill2; cx.beginPath(); cx.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 20) cx.lineTo(x, H * 0.58 + Math.sin((x + cam * 0.3) * 0.004) * 40 * S);
  cx.lineTo(W, H); cx.fill();
  if (d === 'wald') { // ganz hinten: viele kleine dunkle Bäume
    const sp = 70 * S, off = (cam * 0.4) % sp;
    for (let k = -1; k < W / sp + 2; k++) { const x = k * sp - off, idx = k + Math.floor(cam * 0.4 / sp), r = Math.abs(Math.sin(idx * 3.7)) % 1;
      const by = H * 0.6 + Math.sin((x + cam * 0.3) * 0.004) * 40 * S + 10 * S;
      cx.fillStyle = '#2c6b35'; cx.fillRect(x - 3 * S, by - 30 * S, 6 * S, 30 * S);
      circle(x, by - 45 * S - r * 15 * S, (20 + r * 10) * S, r > 0.5 ? '#2f7a3b' : '#357f40'); }
  }
  cx.fillStyle = w.hill; cx.beginPath(); cx.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 20) cx.lineTo(x, H * 0.64 + Math.sin((x + cam * 0.5) * 0.006 + 2) * 30 * S);
  cx.lineTo(W, H); cx.fill();
  if (d === 'wald') { // in der Mitte: Tannen und Laubbäume
    const sp = 95 * S, off = (cam * 0.6) % sp;
    for (let k = -1; k < W / sp + 2; k++) { const x = k * sp - off, idx = k + Math.floor(cam * 0.6 / sp), r = Math.abs(Math.sin(idx * 5.3)) % 1;
      const by = H * 0.66 + Math.sin((x + cam * 0.5) * 0.006 + 2) * 30 * S + 6 * S;
      if (r > 0.5) { cx.fillStyle = '#6b4423'; cx.fillRect(x - 4 * S, by - 20 * S, 8 * S, 22 * S);
        for (let q = 0; q < 3; q++) { const ty = by - 18 * S - q * 22 * S, tw = (30 - q * 7) * S; cx.fillStyle = q % 2 ? '#2f8a45' : '#3a9a50'; cx.beginPath(); cx.moveTo(x - tw, ty); cx.lineTo(x, ty - 38 * S); cx.lineTo(x + tw, ty); cx.fill(); } }
      else drawTree(x, by, S * (0.55 + r * 0.3), '#43a84f', '#3a9446');
    }
  }
}

// ein paar kleine Blumen am Boden (nicht zu viele)
const SMALL_COLS = { city: ['#ff6fae', '#ffd23f', '#ffffff', '#c77dff', '#6fd3ff'], regenbogen: ['#ff6b6b', '#ffb347', '#ffe66b', '#7ee081', '#6fc3ff', '#b58cff'], suess: ['#ff7bb5', '#ffffff', '#8fd3ff', '#ffd23f'], nacht: ['#bff0ff', '#fff3a0', '#e0c3ff'], wasser: [], wald: ['#ff9ec7', '#ffffff', '#8fb8ff', '#ffd23f'], wiese: ['#ff6fae', '#c77dff', '#ffffff'], strand: ['#ff6f91', '#ffb347', '#ffffff'],
