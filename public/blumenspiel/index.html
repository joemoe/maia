<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Blumenspiel</title>
<style>
  :root { --bg: #1d2b1f; --fg: #fff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .pad { position: fixed; bottom: 14px; display: flex; gap: 12px; z-index: 5; }
  .pad.left { left: 16px; } .pad.right { right: 16px; }
  body:not(.playing) .pad { display: none; }
  body:not(.bossfight) .pad .throw { display: none; }
  .pad .throw { border-color: #c77dff; background: #c77dff66; }
  .pad.small button { width: 58px; height: 58px; font-size: 26px; }
  .pad.small { gap: 8px; }
  #padR.small button { border-color: #ff6fae; background: #ff6fae55; }
  #padL.small button { border-color: #36b6f0; background: #36b6f055; }
  #mute, #quit { position: fixed; right: 16px; top: 92px; z-index: 6; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #ffffffcc;
    background: #ffffff55; touch-action: none; padding: 0; display: grid; place-items: center; cursor: pointer; }
  #quit { display: none; }
  body:not(.ingame) #mute { top: 12px; }
  body.ingame #quit { display: grid; }
  body.ingame #quit { top: 104px; }
  body.ingame #mute { top: 160px; }
  #mute svg, #quit svg { width: 26px; height: 26px; }
  .pad button svg { width: 52%; height: 52%; display: block; margin: auto; pointer-events: none; filter: drop-shadow(0 2px 2px #0005); }
  #mute svg, #quit svg { filter: drop-shadow(0 1px 2px #0005); }
  .pad .tag { align-self: center; font-weight: bold; font-size: 18px; text-shadow: 0 2px 3px #0008; }
  .pad button { width: 74px; height: 74px; border-radius: 50%; border: 3px solid #ffffffcc; background: #ffffff44;
    padding: 0; color: #fff; touch-action: none; }
  .pad button:active, .pad button.on { background: #ffffff88; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="pad left" id="padL"></div>
<div class="pad right" id="padR"></div>
<button id="quit" aria-label="Zurück zum Startmenü"></button>
<button id="mute" aria-label="Musik an oder aus"></button>
<script>
"use strict";
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W = 0, H = 0, S = 1; // S = scale so the game looks the same on every screen
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = H / 600;
}
addEventListener('resize', resize); resize();

/* ---------- Welten ---------- */
const WORLDS = [
  { name: 'Wald', sky: ['#8fd3ff', '#d9f4ff'], hill: '#4f9a4a', hill2: '#3a7d3c', ground: '#5cb85c', dirt: '#7a4e2d', deco: 'wald', len: 12000,
    foes: ['leaf'], helper: { kind: 'gaensebluemchen', name: 'Gänseblümchen', tip: 'Hallo! Halte ⬇ gedrückt, dann gräbst du dich ein. Das kostet einen lila Samen. Die Blätter fliegen dann über dich drüber!' } },
  { name: 'Wiese', sky: ['#7ec8ff', '#fff3c4'], hill: '#8fd16a', hill2: '#6dbb55', ground: '#9be07a', dirt: '#8a5a33', deco: 'wiese', len: 13000,
    foes: ['blumi', 'blumi', 'leaf'], helper: { kind: 'loewenzahn', name: 'Löwenzahn', tip: 'Vorsicht, hier stampft ein böses Blumenmonster herum! Hüpf drüber oder grab dich ein. Jeder lila Samen hilft dir einmal.' } },
  { name: 'Strand', sky: ['#5ec2ff', '#ffe9c9'], hill: '#3fb5d6', hill2: '#2a9cc4', ground: '#f6dc9a', dirt: '#d9b46a', deco: 'strand', len: 14000,
    foes: ['meer', 'meer', 'leaf'], helper: { kind: 'hibiskus', name: 'Hibiskus', tip: 'Huhu! Vorsicht, aus dem Wasser kriecht ein gemeines Meermonster! Hüpf drüber oder grab dich ein.' } },
  { name: 'Wüste', sky: ['#ffb36b', '#ffe6a8'], hill: '#e9b35f', hill2: '#d89a45', ground: '#f3c977', dirt: '#c98f45', deco: 'wueste', len: 15000,
    foes: ['troll', 'troll', 'leaf'], helper: { kind: 'kaktusbluete', name: 'Kaktusblüte', tip: 'Pass auf, hier wohnen gemeine Trolle! Spring drüber oder grab dich ein.' } },
  { name: 'Schneeberg', sky: ['#9fb8ff', '#f2f6ff'], hill: '#c9d6f2', hill2: '#aebfe6', ground: '#ffffff', dirt: '#9aa9c9', deco: 'schnee', len: 16000,
    foes: ['yeti', 'yeti', 'leaf'], helper: { kind: 'schneegloeckchen', name: 'Schneeglöckchen', tip: 'Brrr! Die Schneemonster sind gemein. Und wenn ein Schneesturm kommt: grab dich ein oder geh ins Blumenhaus!' } },
  { name: 'Blumenparty', sky: ['#ffb3e6', '#fff0fa'], hill: '#ff8ad8', hill2: '#c77dff', ground: '#9be07a', dirt: '#8a5a33', deco: 'party', len: 7000,
    foes: [], boss: true, secretAt: [0.45, 0.8],
    helper: { kind: 'hibiskus', name: 'Partyblume', tip: 'Juhuu! Willkommen auf der großen Blumenparty! Psst, hier sind auch zwei Geheimtüren versteckt.' } },
  { name: 'Regenbogenland', sky: ['#9fe3ff', '#fff0fb'], hill: '#b9a6ff', hill2: '#9fd8ff', ground: '#a8f0a0', dirt: '#8a6bc9', deco: 'regenbogen', len: 12000,
    foes: ['wolke', 'wolke', 'leaf'], helper: { kind: 'regenbogenblume', name: 'Regenbogenblume', tip: 'Hallo! Pass auf die graue Grummelwolke auf, sie will alle Farben wegregnen! Hüpf drüber oder grab dich ein.' } },
  { name: 'Süßigkeitenland', sky: ['#ffc4e1', '#fff6e0'], hill: '#ff9ecb', hill2: '#ffd1e8', ground: '#fff5fa', dirt: '#7b4a2e', deco: 'suess', len: 13000,
    foes: ['gummi', 'gummi', 'leaf'], helper: { kind: 'zuckerblume', name: 'Zuckerblume', tip: 'Mmmh, hier ist alles süß! Aber Vorsicht vor dem klebrigen Kaugummi-Monster! Hüpf drüber oder grab dich ein.' } },
  { name: 'Nachtgarten', sky: ['#141a4a', '#3b2f7a'], hill: '#2a3a6a', hill2: '#1e2a55', ground: '#2f6b4f', dirt: '#3a2a40', deco: 'nacht', len: 14000,
    foes: ['fleder', 'fleder', 'leaf'], helper: { kind: 'mondblume', name: 'Mondblume', tip: 'Psst, ganz leise! Nachts fliegen freche Fledermäuse herum. Hüpf drüber oder grab dich ein!' } },
  { name: 'Unterwasserwelt', sky: ['#5fd0ff', '#1a6fb0'], hill: '#3a8fc0', hill2: '#2a7ab0', ground: '#f2dca0', dirt: '#d4b878', deco: 'wasser', len: 14000,
    foes: ['hai', 'hai', 'qualle'], helper: { kind: 'seerose', name: 'Seeanemone', tip: 'Blubb! Willkommen unter Wasser! Vorsicht vor dem Hai und den Quallen. Hüpf drüber oder grab dich ein!' } },
];

/* ---------- Zustand ---------- */
const st = {
  screen: 'start',   // start | play | star | home | win
  kind: 'tulpe', kind2: 'rose', two: false, picker: 0,
  world: 0, stars: 0,
  hearts: 4, seeds: 0,
  x: 120, vy: 0, jumpY: 0, digging: 0, hurt: 0, walk: 0, face: 1,
  camX: 0, leaves: [], seedsOnMap: [], sparkles: [], leafTimer: 6, msgT: 0, msg: '',
  screenT: 0, flakes: [], checkpoint: 140, homeFrom: 'die', sleepT: 0, homeMode: 'menu', eaten: 0, btns: [], hidCount: 0, nearDoor: false, helperTalk: 0, secrets: [], returnX: 0,
};
const KINDS = ['tulpe', 'rose', 'sonnenblume', 'mohn'];
const NAMES = { tulpe: ['Fratz', 'die Tulpe'], rose: ['Mara', 'die Rose'], sonnenblume: ['Lina', 'die Sonnenblume'], mohn: ['Mona', 'die Mohnblume'] };
const mkKeys = () => ({ left: false, right: false, dig: false, hop: false, throw: false });
// Spieler 1 und Spieler 2 (beim Spielen zu zweit)
const P = [0, 1].map(id => ({ id, x: 140, vy: 0, jumpY: 0, digging: 0, hurt: 0, walk: 0, face: 1, digPaid: false, digWarned: false, nearDoor: false, keys: mkKeys() }));
const keys = P[0].keys;
function seedMax() { return st.two ? 10 : 5; }
function players() { return st.two ? P : [P[0]]; }
function kindOf(p) { return p.id ? st.kind2 : st.kind; }
function nameOf(p) { return NAMES[kindOf(p)][0]; }
function leadX() { return Math.max(...players().map(p => p.x)); }

function groundY(x) {
  // sanfte Hügel
  return H * 0.74 + Math.sin(x * 0.006) * 26 * S + Math.sin(x * 0.0023 + 1) * 18 * S;
}

const HOUSE_X = 240;
const RAINBOW = ['#ff6b6b', '#ffb347', '#ffe66b', '#7ee081', '#6fc3ff', '#b58cff'];
const FLY = new Set(['leaf', 'wolke', 'fleder', 'hai', 'qualle']); // diese Gegner fliegen/schwimmen
const OBST_KIND = { regenbogen: 'kristall', suess: 'torte', nacht: 'kuerbis', wasser: 'muschel', wiese: 'stamm', strand: 'wal', wueste: 'loewe', schnee: 'yeti' };
const OBST = { kristall: { w: 80, h: 70, name: 'Ein Regenbogen-Kristall' }, torte: { w: 110, h: 66, name: 'Eine riesige Torte' }, kuerbis: { w: 96, h: 60, name: 'Ein Leuchtkürbis' }, muschel: { w: 110, h: 56, name: 'Eine Riesenmuschel' }, stamm: { w: 96, h: 52, name: 'Ein Baumstamm' }, wal: { w: 130, h: 64, name: 'Ein Wal' }, loewe: { w: 110, h: 70, name: 'Ein Löwe' }, yeti: { w: 96, h: 86, name: 'Ein großer Yeti' } };
const obHalf = o => (o.w / 2 + 14) * S;
function onObstacle(p) { return st.obst && st.obst.some(o => Math.abs(p.x - o.x) < obHalf(o) && Math.abs(p.jumpY - o.h * S) < 3 && p.vy <= 0); }
function startWorld(i, fromX) {
  if (i !== st.world || fromX == null) st.checkpoint = 140;
  st.world = i;
  const base = fromX != null ? fromX : 140;
  for (const p of P) Object.assign(p, { x: base + (p.id ? 70 : 0), vy: 0, jumpY: 0, digging: 0, hurt: 0, digPaid: false, nearDoor: false });
  st.camX = 0; st.leaves = []; st.sparkles = []; st.leafTimer = 7;
  const w = WORLDS[i];
  st.seedsOnMap = [];
  // Samen: nur so viele, wie man braucht (ungefähr einer pro Gegner)
  for (let x = 1100; x < w.len - 400; x += (1000 + Math.random() * 400) / (st.two ? 2 : 1)) st.seedsOnMap.push({ x, t: Math.random() * 6, got: false, up: 70 + Math.random() * 40 });
  st.helperX = Math.round(w.len * 0.4); st.helperTalk = 0; st.helperMet = false;
  // zwei geheime Eingänge ins Blumenhaus
  st.secrets = (w.secretAt || [0.24, 0.7]).map((f, n) => ({ x: Math.round(w.len * f + (Math.random() - 0.5) * 600), found: false, n }));
  // Hindernisse: passend zum Land (Wald und Party haben keine)
  st.obst = []; st.storm = null; st.stormAt = null; st.stormSheltered = false;
  const OB = OBST_KIND[w.deco];
  if (OB) for (let x = 1800 + Math.random() * 400; x < w.len - 800; x += 1700 + Math.random() * 900) {
    if (Math.abs(x - st.helperX) < 400 || st.secrets.some(q => Math.abs(x - q.x) < 320) || Math.abs(x - base) < 300) continue;
    st.obst.push({ x, kind: OB, w: OBST[OB].w, h: OBST[OB].h, t: Math.random() * 6 });
    // ein Samen liegt immer vor dem Hindernis, damit man drüberhüpfen kann
    st.seedsOnMap.push({ x: x - 330, t: Math.random() * 6, got: false, up: 70 });
    if (st.two) st.seedsOnMap.push({ x: x - 430, t: Math.random() * 6, got: false, up: 90 });
  }
  if (w.deco === 'schnee' && st.secrets[1]) st.stormAt = st.secrets[1].x - 900; // Schneesturm, kurz vor dem 2. Geheimgang
  st.shots = [];
  st.boss = w.boss ? { x: 1700, hp: st.two ? 6 : 8, max: st.two ? 6 : 8, t: 0, atk: 4, hitT: 0, gone: 0, defeated: false, seedT: 0, intro: false } : null;
  st.flakes = [];
  for (let k = 0; k < 60; k++) st.flakes.push({ x: Math.random(), y: Math.random(), s: 1 + Math.random() * 2.5, v: 0.3 + Math.random() * 0.6 });
  st.screen = 'play';
  st.gifts = [];
  st.bee = { x: base - 90, y: null, face: 1, t: 0 };
  if (!album.seen[i]) { album.seen[i] = 1; saveAlbum(); }
  setTimeout(saveGame, 0);
  if (fromX == null) say(i === 0 ? 'Los geht\'s, ' + players().map(nameOf).join(' und ') + '! Besuche die ganze Welt!' : 'Willkommen: ' + w.name + '!');
}
function say(m) { st.msg = m; st.msgT = 3; }
// Sammelalbum: merkt sich besuchte Länder, Sterne, Geheimtüren und den Blätterkönig
let album = { seen: [], star: [], sec: [], boss: 0 };
try { const a = JSON.parse(localStorage.getItem('blumen-album') || 'null'); if (a) album = Object.assign(album, a); } catch (e) {}
for (const k of ['seen', 'star', 'sec']) while (album[k].length < WORLDS.length) album[k].push(0);
function saveAlbum() { try { localStorage.setItem('blumen-album', JSON.stringify(album)); } catch (e) {} }

/* ---------- Töne ---------- */
let ac = null;
function beep(f, d = 0.12, type = 'sine', vol = 0.15, slide = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
/* ---------- Musik: für jedes Land ein eigenes Lied ---------- */
const SONGS = {
  start:  { key: 60, bpm: 118, prog: [0, 9, 5, 7], mel: 'triangle', bass: 'sine', seed: 3 },
  wald:   { key: 60, bpm: 112, prog: [0, 9, 5, 7], mel: 'triangle', bass: 'sine', seed: 11 },
  wiese:  { key: 62, bpm: 126, prog: [0, 5, 7, 5], mel: 'square', bass: 'triangle', seed: 7, melVol: .5 },
  strand: { key: 65, bpm: 100, prog: [0, 7, 9, 5], mel: 'sine', bass: 'triangle', seed: 21, swing: true },
  wueste: { key: 57, bpm: 96, prog: [0, 8, 3, 10], minor: true, mel: 'triangle', bass: 'sine', seed: 5 },
  schnee: { key: 64, bpm: 88, prog: [0, 5, 9, 7], mel: 'sine', bass: 'sine', seed: 17, bell: true },
  regenbogen: { key: 64, bpm: 120, prog: [0, 9, 5, 7], mel: 'triangle', bass: 'sine', seed: 31, bell: true },
  suess:  { key: 65, bpm: 132, prog: [0, 5, 7, 5], mel: 'square', bass: 'triangle', seed: 41, melVol: .45, bounce: true },
  nacht:  { key: 57, bpm: 84, prog: [0, 8, 5, 7], minor: true, mel: 'sine', bass: 'sine', seed: 23, bell: true },
  wasser: { key: 62, bpm: 96, prog: [0, 7, 9, 5], mel: 'sine', bass: 'triangle', seed: 37, swing: true },
  party:  { key: 67, bpm: 140, prog: [0, 7, 9, 5], mel: 'square', bass: 'triangle', seed: 9, drums: true, melVol: .5, bounce: true },
  boss:   { key: 62, bpm: 150, prog: [0, 0, 10, 8], minor: true, mel: 'sawtooth', bass: 'triangle', seed: 13, drums: true, melVol: .35 },
  house:  { key: 60, bpm: 72, prog: [0, 5, 0, 7], mel: 'sine', bass: 'sine', seed: 2, bell: true },
};
// Melodien werden aus der Fünfton-Leiter gebaut, die klingt immer schön
function makeTune(sg) {
  let r = sg.seed * 9301 + 49297; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const scale = sg.minor ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9];
  const mel = []; let deg = 5;
  for (let phrase = 0; phrase < 2; phrase++) for (let bar = 0; bar < 4; bar++) for (let st8 = 0; st8 < 8; st8++) {
    if (phrase === 1 && bar < 2) { mel.push(mel[bar * 8 + st8]); continue; } // Wiederholung macht es zum Mitsummen
    if (st8 % 2 === 1 && rnd() < 0.45) { mel.push(null); continue; }
    deg = Math.max(2, Math.min(9, deg + [-2, -1, -1, 0, 1, 1, 2][Math.floor(rnd() * 7)]));
    if (bar === 3 && st8 >= 6) deg = phrase ? 5 : 6;
    mel.push(Math.floor(deg / 5) * 12 + scale[deg % 5]);
  }
  return mel;
}
const music = { on: true, song: null, step: 0, next: 0, tune: null, noise: null };
try { music.on = localStorage.getItem('blumen-musik') !== 'aus'; } catch (e) {}
function note(f, t, d, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function drum(t, kind) {
  if (kind === 'kick') { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.2); return; }
  if (!music.noise) { const b = ac.createBuffer(1, ac.sampleRate * 0.1, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; music.noise = b; }
  const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); n.buffer = music.noise; f.type = 'highpass'; f.frequency.value = 7000;
  g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05); n.connect(f); f.connect(g); g.connect(ac.destination); n.start(t); n.stop(t + 0.06);
}
function currentSong() {
  if (st.screen === 'start') return 'start';
  if (st.screen === 'home') return 'house';
  if (st.screen === 'win') return 'party';
  if (st.boss && !st.boss.defeated && players().some(p => st.boss.x - p.x < W * 0.9)) return 'boss';
  return WORLDS[st.world].deco;
}
function musicTick() {
  if (!ac || !music.on) return;
  const name = currentSong();
  if (name !== music.song) { music.song = name; music.tune = makeTune(SONGS[name]); music.step = 0; music.next = ac.currentTime + 0.1; }
  const sg = SONGS[name], dur = 60 / sg.bpm / 2; // Achtelnoten
  while (music.next < ac.currentTime + 0.25) {
    const i = music.step % 64, bar = Math.floor(i / 8) % 4, st8 = i % 8, t = music.next + (sg.swing && st8 % 2 ? dur * 0.25 : 0);
    const root = sg.key - 12 + sg.prog[bar], m = music.tune[i];
    if (m != null) { note(mtof(sg.key + m), t, dur * 1.6, sg.mel, 0.05 * (sg.melVol || 1)); if (sg.bell) note(mtof(sg.key + m + 12), t, dur * 2.5, 'sine', 0.015); }
    if (sg.bounce) { if (st8 % 2 === 0) note(mtof(root - 12 + (st8 % 4 ? 12 : 0)), t, dur * 0.9, sg.bass, 0.07); }
    else if (st8 === 0 || st8 === 4) note(mtof(root - 12 + (st8 === 4 ? 7 : 0)), t, dur * 3.5, sg.bass, 0.07);
    if (st8 === 0 || st8 === 4) { const third = sg.minor ? 3 : 4; [0, third, 7].forEach(iv => note(mtof(root + iv), t, dur * 3, 'sine', 0.012)); }
    if (sg.drums) { if (st8 % 4 === 0) drum(t, 'kick'); if (st8 % 2 === 1) drum(t, 'hat'); }
    music.step++; music.next += dur;
  }
}
setInterval(musicTick, 60);
// gezeichnete Symbole (statt Emojis), alle im gleichen Stil: weiße, runde Linien
const ICON = {
  left: '<path d="M15 5 L7 12 L15 19 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>',
  right: '<path d="M9 5 L17 12 L9 19 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>',
  hop: '<path d="M5 15 L12 7 L19 15 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>',
  dig: '<path d="M5 9 L12 17 L19 9 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>',
  throw: '<ellipse cx="12" cy="12.5" rx="5.5" ry="7.5" transform="rotate(25 12 12.5)" fill="#9b4dff" stroke="#fff" stroke-width="2"/><ellipse cx="10.3" cy="9.8" rx="1.6" ry="2.6" transform="rotate(25 10.3 9.8)" fill="#fff" opacity=".7"/><path d="M19 3.5 l.8 1.8 1.8 .8 -1.8 .8 -.8 1.8 -.8 -1.8 -1.8 -.8 1.8 -.8z" fill="#fff6c0"/>',
  soundOn: '<path d="M4 9.5 H8 L13 5 V19 L8 14.5 H4 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M16 9 Q18 12 16 15 M18.5 6.5 Q22 12 18.5 17.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>',
  soundOff: '<path d="M4 9.5 H8 L13 5 V19 L8 14.5 H4 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M16.5 9.5 L21 14.5 M21 9.5 L16.5 14.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>',
  quit: '<path d="M6.5 6.5 L17.5 17.5 M17.5 6.5 L6.5 17.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>',
};
const svgIcon = k => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[k] + '</svg>';
function toggleMusic() {
  music.on = !music.on; music.song = null;
  document.getElementById('mute').innerHTML = svgIcon(music.on ? 'soundOn' : 'soundOff');
  try { localStorage.setItem('blumen-musik', music.on ? 'an' : 'aus'); } catch (e) {}
}
document.getElementById('mute').innerHTML = svgIcon(music.on ? 'soundOn' : 'soundOff');
document.getElementById('quit').innerHTML = svgIcon('quit');
document.getElementById('quit').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toStart(); });
// X: zurück zum Startmenü (der Spielstand bleibt gespeichert, man kann weiterspielen)
function toStart() {
  if (st.screen === 'start') return;
  if (st.screen === 'play' || st.screen === 'home') saveGame();
  for (const p of P) for (const k in p.keys) p.keys[k] = false;
  st.screen = 'start'; st.screenT = 0; st.msgT = 0; st.picker = 0; beep(500, .08);
}
document.getElementById('mute').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (!ac) beep(1, 0.01, 'sine', 0.0001); toggleMusic(); });
// Der Browser erlaubt Töne erst nach dem ersten Tippen
addEventListener('pointerdown', () => { if (!ac) beep(1, 0.01, 'sine', 0.0001); else if (ac.state === 'suspended') ac.resume(); }, true);
addEventListener('keydown', () => { if (!ac) beep(1, 0.01, 'sine', 0.0001); else if (ac.state === 'suspended') ac.resume(); }, true);

const sfx = {
  seed: () => { beep(880, .1); setTimeout(() => beep(1320, .15), 70); },
  hop: () => beep(500, .25, 'triangle', .15, 500),
  hurt: () => beep(300, .3, 'sawtooth', .08, -150),
  dig: () => beep(180, .2, 'triangle', .12, -60),
  star: () => [660, 880, 990, 1320].forEach((f, i) => setTimeout(() => beep(f, .2, 'triangle'), i * 120)),
};

/* ---------- Steuerung ---------- */
// Allein: Pfeiltasten oder WASD. Zu zweit: Spieler 1 = Pfeiltasten, Spieler 2 = W A S D.
// Samen werfen: Spieler 1 = Leertaste, Spieler 2 = E
const keyMap = { ArrowLeft: [0, 'left'], ArrowRight: [0, 'right'], ArrowDown: [0, 'dig'], ArrowUp: [0, 'hop'], ' ': [0, 'throw'],
  a: [1, 'left'], d: [1, 'right'], s: [1, 'dig'], w: [1, 'hop'], e: [1, 'throw'] };
function mapKey(e) {
  const m = keyMap[e.key.length === 1 ? e.key.toLowerCase() : e.key]; if (!m) return null;
  return [st.two ? P[m[0]] : P[0], m[1]];
}
addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') { toggleMusic(); return; }
  if (e.key === 'Escape' && (st.screen === 'play' || st.screen === 'star' || st.screen === 'win' || (st.screen === 'home' && st.homeMode === 'menu'))) { toStart(); return; }
  if (st.screen === 'home') {
    const m = st.homeMode === 'cook' ? ({ '1': 'ing0', '2': 'ing1', '3': 'ing2', '4': 'ing3', '5': 'ing4', '6': 'ing5', Enter: 'cookgo', ' ': 'cookgo', Escape: 'back', Backspace: 'back' }[e.key])
      : st.homeMode === 'album' ? ({ Escape: 'back', Backspace: 'back', Enter: 'back' }[e.key]) : st.homeMode === 'doors'
      ? ({ '1': 'w0', '2': 'w1', '3': 'w2', '4': 'w3', '5': 'w4', '6': 'w5', '7': 'w6', '8': 'w7', '9': 'w8', '0': 'w9', Escape: 'back', Backspace: 'back' }[e.key])
      : ({ '1': 'sleep', ArrowLeft: 'sleep', '2': 'eat', ArrowRight: 'eat', '3': 'cook', '4': 'travel', '5': 'ward', '6': 'swap', '7': 'album', '8': 'out', Enter: 'out' }[e.key]);
    if (m) homeAction(m);
    return;
  }
  if (st.screen === 'start') {
    const cyc = (k, d) => KINDS[(KINDS.indexOf(k) + d + KINDS.length) % KINDS.length];
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') st.kind = cyc(st.kind, e.key === 'ArrowLeft' ? -1 : 1);
    if (st.two && (e.key === 'a' || e.key === 'd')) st.kind2 = cyc(st.kind2, e.key === 'a' ? -1 : 1);
    if (e.key === 'Enter' || e.key === ' ') { if (loadGame()) continueGame(); else begin(); }
    return;
  }
  const m = mapKey(e);
  if (m) { e.preventDefault(); const [p, k] = m; if (k === 'hop' && !p.keys.hop) tryHop(p); if (k === 'throw' && !p.keys.throw) throwSeed(p); p.keys[k] = true; }
  if (e.key === 'Enter' || e.key === ' ') onTapScreen(null);
});
addEventListener('keyup', e => { const m = mapKey(e); if (m) m[0].keys[m[1]] = false; });

function buildPads() {
  const L = document.getElementById('padL'), Rr = document.getElementById('padR');
  L.innerHTML = ''; Rr.innerHTML = '';
  const mk = (parent, p, k, label, txt) => {
    const b = document.createElement('button'); b.innerHTML = svgIcon(k); if (k === 'throw') b.className = 'throw'; b.setAttribute('aria-label', label); parent.appendChild(b);
    const on = e => { e.preventDefault(); if (st.screen !== 'play') return; if (k === 'hop') tryHop(p); if (k === 'throw') throwSeed(p); p.keys[k] = true; b.classList.add('on'); };
    const off = e => { e.preventDefault(); p.keys[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
  };
  const all = (parent, p) => { mk(parent, p, 'left', 'nach links', '◀'); mk(parent, p, 'right', 'nach rechts', '▶'); mk(parent, p, 'dig', 'eingraben', '⬇'); mk(parent, p, 'hop', 'hüpfen', '⬆'); mk(parent, p, 'throw', 'Samen werfen', '🌱'); };
  L.classList.toggle('small', st.two); Rr.classList.toggle('small', st.two);
  if (st.two) { all(L, P[1]); all(Rr, P[0]); }
  else { mk(L, P[0], 'left', 'nach links', '◀'); mk(L, P[0], 'right', 'nach rechts', '▶'); mk(Rr, P[0], 'dig', 'eingraben', '⬇'); mk(Rr, P[0], 'hop', 'hüpfen', '⬆'); mk(Rr, P[0], 'throw', 'Samen werfen', '🌱'); }
}
buildPads();
cv.addEventListener('pointerdown', e => onTapScreen(e));

function onTapScreen(e) {
  if (st.screen === 'start') {
    if (!e) { begin(); return; }
    for (const b of st.btns) if (e.clientX > b.x && e.clientX < b.x + b.w && e.clientY > b.y && e.clientY < b.y + b.h) {
      if (b.id === 'go') begin();
      else if (b.id === 'cont') continueGame();
      else if (b.id.startsWith('lv')) { st.startWorld = +b.id.slice(2); beep(600 + st.startWorld * 80, .08); }
      else { st.two = b.id === '2p'; st.picker = 0; buildPads(); beep(700, .08); }
      return;
    }
    if (e.clientY > H * 0.36 && e.clientY < H * 0.86) {
      const k = KINDS[Math.min(KINDS.length - 1, Math.floor(e.clientX / (W / KINDS.length)))];
      if (!st.two) { if (st.kind === k) { if (loadGame()) continueGame(); else begin(); } else { st.kind = k; beep(700, .08); } }
      else { if (st.picker === 0) st.kind = k; else st.kind2 = k; st.picker = 1 - st.picker; beep(700 + st.picker * 200, .08); }
    }
  } else if (st.screen === 'home') {
    if ((st.homeMode !== 'menu' && st.homeMode !== 'doors' && st.homeMode !== 'ward' && st.homeMode !== 'swap' && st.homeMode !== 'album' && st.homeMode !== 'cook') || !e) return;
    for (const b of st.btns) if (e.clientX > b.x && e.clientX < b.x + b.w && e.clientY > b.y && e.clientY < b.y + b.h) homeAction(b.id);
  } else if (st.screen === 'star' && st.screenT > 1) {
    if (st.world + 1 < WORLDS.length) startWorld(st.world + 1); else { st.screen = 'win'; st.screenT = 0; sfx.star(); }
  } else if (st.screen === 'win' && st.screenT > 2) {
    st.stars = 0; st.seeds = 0; st.hearts = 4; st.screen = 'start';
  }
}
function goHome(why) {
  st.cookSeed = false;
  if (st.storm) { st.storm = null; st.stormSheltered = why === 'visit'; }
  st.homeFrom = why; st.screen = 'home'; st.screenT = 0; st.sleepT = 0; st.msgT = 0; beep(520, .15, 'triangle');
  st.hidCount = st.leaves.filter(L => !L.hit && Math.abs(L.x - P[0].x) < W * 1.2).length;
  st.homeMode = why === 'die' ? 'sleep' : 'menu';
  for (const p of P) for (const k in p.keys) p.keys[k] = false;
}
function homeAction(id) {
  if (st.homeMode === 'cook') { cookAction(id); return; }
  if (st.homeMode === 'album') { if (id === 'back') { st.homeMode = 'menu'; beep(500, .08); } return; }
  if (st.homeMode === 'swap') {
    if (id === 'back' || id === 'out') { st.homeMode = 'menu'; beep(500, .08); }
    else if (id === 'for0' || id === 'for1') { st.wardFor = +id[3]; beep(700, .06); }
    else if (id && id.startsWith('kind:')) {
      const k = id.slice(5); if (st.wardFor) st.kind2 = k; else st.kind = k;
      beep(880, .08); setTimeout(() => beep(1175, .1), 70); say('Hallo, ich bin ' + NAMES[k][0] + '!');
    }
    return;
  }
  if (st.homeMode === 'ward') {
    if (id === 'back' || id === 'out') { st.homeMode = 'menu'; beep(500, .08); }
    else if (id === 'for0' || id === 'for1') { st.wardFor = +id[3]; beep(700, .06); }
    else if (id && id.startsWith('wear:')) {
      const w = id.slice(5), it = WEAR.find(x => x.id === w);
      if (w !== 'none' && (!it || it.stars > unlocked)) { say('Dafür brauchst du ' + it.stars + ' Sterne!'); beep(200, .15, 'triangle'); return; }
      st.wear[st.wardFor || 0] = w === 'none' ? null : w; saveWear(); beep(880, .08); setTimeout(() => beep(1175, .1), 70);
    }
    return;
  }
  if (st.homeMode === 'doors') {
    if (id === 'back') { st.homeMode = 'menu'; beep(500, .08); }
    else if (id && id[0] === 'w') { st.hearts = Math.max(st.hearts, 1); sfx.star(); startWorld(+id.slice(1)); }
    return;
  }
  if (st.homeMode !== 'menu') return;
  beep(660, .08);
  if (id === 'travel') { st.homeMode = 'doors'; return; }
  if (id === 'ward') { st.homeMode = 'ward'; st.wardFor = 0; return; }
  if (id === 'swap') { st.homeMode = 'swap'; st.wardFor = 0; return; }
  if (id === 'album') { st.homeMode = 'album'; return; }
  if (id === 'cook') { st.homeMode = 'cook'; st.cook = { picked: [], stir: 0, phase: 'pick', spin: 0 }; say('Wähle 3 Zutaten für den Kochtopf!'); return; }
  if (id === 'sleep') { st.homeMode = 'sleep'; st.sleepT = 0; st.screenT = 0; }
  else if (id === 'eat') { st.homeMode = 'eat'; st.sleepT = 0; st.eaten = 0; st.screenT = 0; }
  else if (id === 'out') {
    st.leaves = []; // die Blätter sind weitergeflogen, während du drinnen warst
    if (st.homeFrom === 'visit') {
      st.screen = 'play'; P[0].x = (st.returnX || HOUSE_X) + 50; P[1].x = (st.returnX || HOUSE_X) + 120;
      say(st.stormSheltered ? 'Der Schneesturm ist vorbei! Gut versteckt!' : st.hidCount ? 'Puh! Die Blätter sind weitergeflogen.' : 'Tschüss, Blumenhaus!'); st.stormSheltered = false;
    }
    else { startWorld(st.world, st.checkpoint); say('Weiter geht\'s!'); }
  }
}
// Weiterspielen: das Spiel merkt sich Land, Stelle, Sterne und Samen
function saveGame() {
  try { localStorage.setItem('blumen-spielstand', JSON.stringify({ world: st.world, at: st.checkpoint, stars: st.stars, seeds: st.seeds })); } catch (e) {}
}
function loadGame() { try { return JSON.parse(localStorage.getItem('blumen-spielstand') || 'null'); } catch (e) { return null; } }
function clearGame() { try { localStorage.removeItem('blumen-spielstand'); } catch (e) {} }
function continueGame() {
  const g = loadGame(); if (!g) { begin(); return; }
  st.hearts = 4; st.seeds = Math.min(g.seeds || 0, seedMax()); st.stars = g.stars || 0; beep(660, .1);
  startWorld(g.world, g.at > 140 ? g.at : null);
  say('Weiter geht\'s in: ' + WORLDS[g.world].name + '!');
}
function begin() { st.hearts = 4; st.seeds = 0; st.stars = 0; beep(660, .1); startWorld(st.startWorld || 0); }

function tryHop(p) {
  if (st.screen !== 'play' || (p.jumpY > 0 && !onObstacle(p)) || p.digging > 0.2) return;
  if (p.nearDoor) { st.returnX = p.nearDoor; goHome('visit'); return; }
  if (st.seeds > 0) {
    st.seeds--; p.vy = 640 * S; p.jumpY = Math.max(0.01, p.jumpY); sfx.hop();
    for (let i = 0; i < 12; i++) st.sparkles.push(spark(p.x, groundY(p.x) - 10 * S, '#c77dff'));
  } else say('Sammle lila Samen, dann kannst du hüpfen!');
}
function throwSeed(p) {
  if (st.screen !== 'play' || p.digging > 0.3) return;
  if (!st.boss || st.boss.defeated) { say('Samen werfen geht nur beim Blätterkönig!'); return; }
  if (st.seeds <= 0) { say('Keine Samen mehr! Sammle neue, sie fallen vom Himmel.'); return; }
  st.seeds--; beep(760, .1, 'triangle', .12, 300);
  st.shots.push({ x: p.x + 20 * S, y: groundY(p.x) - p.jumpY - 95 * S, vx: 700 * S, t: 0 });
}
function spark(x, y, c) { return { x, y, vx: (Math.random() - .5) * 160, vy: -Math.random() * 160, t: .8, c }; }

/* ---------- Spiel-Logik ---------- */
function update(dt) {
  st.screenT += dt;
  if (st.msgT > 0) st.msgT -= dt;
  if (st.screen === 'home') {
    st.sleepT += dt;
    if (st.homeMode === 'sleep') {
      if (st.hearts < 4 && st.sleepT > 1.2) { st.hearts++; st.sleepT = 0; beep(700 + st.hearts * 120, .2, 'triangle'); }
      else if (st.hearts >= 4 && st.sleepT > 1.6) { st.homeMode = 'menu'; say('Gut ausgeschlafen!'); }
    } else if (st.homeMode === 'eat') {
      if (st.eaten < 4 && st.sleepT > 0.9) {
        st.eaten++; st.sleepT = 0; beep(500, .08, 'square', .06); setTimeout(() => beep(620, .1, 'square', .06), 90);
        if (st.hearts < 4) { st.hearts++; setTimeout(() => beep(700 + st.hearts * 120, .2, 'triangle'), 200); }
      } else if (st.eaten >= 4 && st.sleepT > 1.2) { st.homeMode = 'menu'; say('Mmmh, das war lecker!'); }
    }
    return;
  }
  if (st.screen !== 'play') return;
  const w = WORLDS[st.world];
  const speed = 210 * S;
  const ps = players();

  for (const p of ps) {
    const k = p.keys;
    // Eingraben kostet einen Samen (einmal pro Eingraben)
    if (k.dig && p.jumpY <= 0 && !p.digPaid && p.digging === 0) {
      if (st.seeds > 0) { st.seeds--; p.digPaid = true; sfx.dig(); for (let i = 0; i < 8; i++) st.sparkles.push(spark(p.x, groundY(p.x) - 10 * S, '#c77dff')); }
      else if (!p.digWarned) { p.digWarned = true; say('Zum Eingraben brauchst du einen lila Samen!'); }
    }
    if (!k.dig) p.digWarned = false;
    if (k.dig && p.digPaid && p.jumpY <= 0) p.digging = Math.min(1, p.digging + dt * 4);
    else { p.digging = Math.max(0, p.digging - dt * 4); if (p.digging === 0) p.digPaid = false; }
    // laufen (nicht wenn eingegraben)
    let mv = 0;
    if (p.digging < 0.3) { if (k.left) mv -= 1; if (k.right) mv += 1; }
    if (mv) { p.face = mv; p.walk += dt * 9; }
    const oldX = p.x, oldJ = p.jumpY;
    p.x = Math.max(60, Math.min(w.len, p.x + mv * speed * dt));
    // Hindernisse: man kommt nur drüber, wenn man hoch genug hüpft (oder oben drauf steht)
    for (const o of st.obst) { const hw = obHalf(o);
      if (Math.abs(p.x - o.x) < hw && p.jumpY < o.h * S - 3) { p.x = oldX <= o.x ? o.x - hw : o.x + hw;
        if (!o.bumped && p.jumpY <= 0) { o.bumped = true; say(OBST[o.kind].name + '! Hüpf drüber!'); } } }
    // hüpfen
    if (p.jumpY > 0) { p.jumpY += p.vy * dt; p.vy -= 1500 * S * dt;
      for (const o of st.obst) if (Math.abs(p.x - o.x) < obHalf(o) && p.vy < 0 && p.jumpY < o.h * S && oldJ >= o.h * S - 3) { p.jumpY = o.h * S; p.vy = 0; } // oben drauf landen
      if (p.jumpY <= 0) { p.jumpY = 0; p.vy = 0; } }
    p.nearDoor = 0;
    if (p.digging < .3 && p.jumpY <= 0) {
      if (st.world === 0 && Math.abs(p.x - HOUSE_X) < 110) p.nearDoor = HOUSE_X;
      for (const sc of st.secrets) if (Math.abs(p.x - sc.x) < 60) {
        p.nearDoor = sc.x;
        if (!sc.found) { sc.found = true; album.sec[st.world] |= 1 << sc.n; saveAlbum(); say('Psst! Ein geheimer Eingang ins Blumenhaus! Er ist jetzt im Album.'); beep(1046, .12, 'triangle'); setTimeout(() => beep(1568, .2, 'triangle'), 110);
          for (let i = 0; i < 16; i++) st.sparkles.push(spark(sc.x, groundY(sc.x) - 30 * S, i % 2 ? '#ffd23f' : '#ff9ec7')); }
      }
    }
    if (p.hurt > 0) p.hurt -= dt;
  }
  // zu zweit: nicht weiter auseinander als der Bildschirm breit ist
  if (st.two) {
    const gap = W - 140;
    if (P[0].x - P[1].x > gap) { const m = (P[0].x + P[1].x) / 2; P[0].x = m + gap / 2; P[1].x = m - gap / 2; }
    if (P[1].x - P[0].x > gap) { const m = (P[0].x + P[1].x) / 2; P[1].x = m + gap / 2; P[0].x = m - gap / 2; }
  }

  // Blätterkönig: vor der Party
  const B = st.boss;
  if (B && !B.defeated) {
    for (const p of ps) p.x = Math.min(p.x, B.x - 140 * S);
    const near = ps.some(p => B.x - p.x < W * 0.8);
    if (near && !B.intro) { B.intro = true; say('Der Blätterkönig! Wirf Samen auf ihn (Leertaste oder lila Samen-Knopf)!'); }
    if (near) {
      B.t += dt; B.atk -= dt;
      if (B.atk <= 0) { st.leaves.push({ type: 'leaf', x: B.x - 70 * S, t: 0, sp: (120 + Math.random() * 40) * S, hit: false }); B.atk = (st.two ? 4.5 : 3) + Math.random() * 1.5; beep(220, .2, 'sawtooth', .05, -60); }
      // Samen fallen vom Himmel, damit man immer genug hat
      B.seedT -= dt;
      const lying = st.seedsOnMap.filter(sd => !sd.got && sd.x < B.x).length;
      if (B.seedT <= 0 && lying < (st.two ? 5 : 3) && st.seeds < seedMax()) {
        const lo = Math.max(200, st.camX + 80), hi = B.x - 260 * S;
        st.seedsOnMap.push({ x: lo + Math.random() * Math.max(10, hi - lo), t: 0, got: false, up: 70 + Math.random() * 30 }); B.seedT = st.two ? 1.2 : 1.8;
      }
    }
    if (B.hitT > 0) B.hitT -= dt;
  } else if (B && B.defeated) B.gone += dt;
  for (const sh of st.shots) {
    sh.x += sh.vx * dt; sh.t += dt;
    if (B && !B.defeated && Math.abs(sh.x - B.x) < 70 * S) {
      sh.dead = true; B.hp--; B.hitT = 0.35; beep(990, .12, 'triangle');
      for (let i = 0; i < 10; i++) st.sparkles.push(spark(B.x - 40 * S, sh.y, i % 2 ? '#c77dff' : '#fff6a0'));
      if (B.hp <= 0) {
        B.defeated = true; B.gone = 0; album.boss = 1; saveAlbum(); st.leaves = []; sfx.star();
        say('Danke! Jetzt bin ich wieder ein fröhliches grünes Blatt. Viel Spaß auf der Party!'); st.msgT = 5;
        st.checkpoint = B.x + 200;
      }
    }
  }
  st.shots = st.shots.filter(sh => !sh.dead && sh.x < st.camX + W + 100);

  // Kamera
  const mid = ps.reduce((a, p) => a + p.x, 0) / ps.length;
  const target = mid - W * (st.two ? 0.5 : 0.35);
  st.camX += (Math.max(0, Math.min(w.len + 200 - W, target)) - st.camX) * Math.min(1, dt * 5);
  updateBee(dt, ps);

  // sprechende Blume
  const nearHelper = ps.some(p => Math.abs(p.x - st.helperX) < 160);
  st.helperTalk = nearHelper ? Math.min(1, st.helperTalk + dt * 3) : Math.max(0, st.helperTalk - dt * 3);
  if (nearHelper && !st.helperMet) { st.helperMet = true; st.checkpoint = st.helperX; saveGame(); beep(990, .1); setTimeout(() => beep(1200, .12), 90); }

  // Samen einsammeln (die Samen gehören allen zusammen)
  for (const sd of st.seedsOnMap) {
    sd.t += dt;
    if (sd.got) continue;
    const sy = groundY(sd.x) - sd.up * S;
    for (const p of ps) {
      const py = groundY(p.x) - p.jumpY;
      if (!sd.got && Math.abs(sd.x - p.x) < 40 * S && Math.abs(sy - (py - 70 * S)) < 70 * S && p.digging < 0.5 && st.seeds < seedMax()) {
        sd.got = true; st.seeds++; sfx.seed();
        for (let i = 0; i < 14; i++) st.sparkles.push(spark(sd.x, sy, i % 2 ? '#e0aaff' : '#fff6a0'));
        if (st.seeds === seedMax()) say(seedMax() + ' Samen! Die Tasche ist voll.');
      }
    }
  }

  // Gegner: kommen nur selten
  st.leafTimer -= dt;
  const lead = leadX();
  const safeZone = st.world === 0 && lead < 1000; // im Blumendorf ist es sicher
  if (w.foes.length && st.leafTimer <= 0 && !st.storm && lead < w.len - 500 && !safeZone && Math.abs(lead - st.helperX) > 400) {
    const type = w.foes[Math.floor(Math.random() * w.foes.length)];
    const base = type === 'leaf' ? 95 : 80;
    st.leaves.push({ type, x: st.camX + W + 60, t: Math.random() * 6, sp: (base + Math.random() * 40 + st.world * 6) * S, hit: false });
    st.leafTimer = (st.two ? 6 : 7) + Math.random() * 6;
  }
  for (const L of st.leaves) {
    L.x -= L.sp * dt; L.t += dt;
    L.y = FLY.has(L.type) ? groundY(L.x) - (40 + Math.sin(L.t * 3) * 8) * S : groundY(L.x);
    if (L.hit) continue;
    for (const p of ps) {
      if (p.digging > 0.7 || p.hurt > 0) continue;
      const py = groundY(p.x) - p.jumpY;
      const touching = FLY.has(L.type)
        ? Math.abs(L.x - p.x) < 34 * S && L.y > py - 115 * S * (1 - p.digging * 0.9) && L.y < py + 5
        : Math.abs(L.x - p.x) < 38 * S && p.jumpY < 62 * S;
      if (touching) {
        L.hit = true; p.hurt = 1.6; st.hearts--; sfx.hurt();
        if (st.hearts <= 0) { goHome('die'); return; }
        say(st.two ? 'Autsch, ' + nameOf(p) + '! Grab dich ein oder hüpf drüber!' : 'Autsch! Grab dich ein (⬇) oder hüpf drüber (⬆)!');
        break;
      }
    }
  }
  st.leaves = st.leaves.filter(L => L.x > st.camX - 100);
  for (const o of st.obst) o.t += dt;

  // Schneesturm am Schneeberg: eingraben oder ins Blumenhaus, sonst wird es kalt
  if (st.stormAt && !st.storm && lead > st.stormAt) {
    st.storm = { t: 0, warn: 4, dur: 14, cold: [0, 0] }; st.stormAt = null;
    say('Achtung, ein Schneesturm kommt! Grab dich ein oder lauf zum Geheimgang ins Blumenhaus!');
    if (st.seeds < (st.two ? 2 : 1)) { st.seeds = st.two ? 2 : 1; setTimeout(() => say('Summsi bringt dir einen Samen zum Eingraben!'), 3000); }
    beep(300, 0.8, 'sawtooth', 0.04, -150);
  }
  if (st.storm) {
    const sm = st.storm; sm.t += dt;
    if (sm.t > sm.warn + sm.dur) { st.storm = null; say('Der Schneesturm ist vorbei!'); sfx.star(); }
    else if (sm.t > sm.warn) for (const p of ps) {
      if (p.digging > 0.7) { sm.cold[p.id] = Math.max(0, sm.cold[p.id] - dt); continue; }
      sm.cold[p.id] += dt;
      if (sm.cold[p.id] >= 3) { sm.cold[p.id] = 0; p.hurt = 1; st.hearts--; sfx.hurt();
        if (st.hearts <= 0) { goHome('die'); return; }
        say('Brrr, ist das kalt! Grab dich ein!'); }
    }
  }

  // bunter Blumen-Jet saust ab und zu über den Himmel
  st.jetTimer = (st.jetTimer == null ? 6 : st.jetTimer) - dt;
  if (!st.jet && st.jetTimer <= 0 && WORLDS[st.world].deco !== 'wasser') {
    const dir = Math.random() < 0.5 ? 1 : -1;
    st.jet = { giftAt: Math.random() < 0.75 ? W * (0.3 + Math.random() * 0.4) : null, dir, x: dir > 0 ? -120 : W + 120, y: H * (0.2 + Math.random() * 0.12), trail: [], t: 0 };
    st.jetTimer = 14 + Math.random() * 12;
    beep(900, 1.2, 'sawtooth', 0.025, -600); beep(1350, 1.0, 'triangle', 0.02, -700);
  }
  if (st.jet) {
    const J = st.jet; J.t += dt; J.x += J.dir * W * 0.45 * dt;
    J.trail.push({ x: J.x - J.dir * 70 * S, y: J.y + Math.sin(J.t * 4) * 6 * S, a: 1 });
    for (const q of J.trail) q.a -= dt * 0.35;
    J.trail = J.trail.filter(q => q.a > 0);
    // Geschenk abwerfen, wenn der Jet ungefähr in der Mitte ist
    if (!J.dropped && J.giftAt != null && (J.dir > 0 ? J.x >= J.giftAt : J.x <= J.giftAt)) {
      J.dropped = true;
      const type = st.hearts < 4 && Math.random() < 0.45 ? 'heart' : 'seed';
      st.gifts.push({ x: st.camX + J.x, y: J.y + 20 * S, vy: 0, type, t: 0, landed: false });
      beep(1320, .1, 'triangle'); setTimeout(() => beep(1760, .12, 'triangle'), 90);
    }
    if ((J.dir > 0 && J.x > W + 150) || (J.dir < 0 && J.x < -150)) { if (!J.trail.length) st.jet = null; }
  }

  // Geschenke vom Jet schweben am Blumen-Fallschirm herunter
  for (const g of st.gifts) {
    g.t += dt;
    const gy = groundY(g.x) - 18 * S;
    if (!g.landed) { g.y += 70 * S * dt; g.x += Math.sin(g.t * 2) * 20 * S * dt; if (g.y >= gy) { g.y = gy; g.landed = true; } }
    for (const p of ps) {
      const py = groundY(p.x) - p.jumpY;
      if (!g.got && Math.abs(g.x - p.x) < 45 * S && g.y > py - 160 * S && p.digging < 0.5) {
        if (g.type === 'heart' && st.hearts < 4) { g.got = true; st.hearts++; say('Ein Herz vom Blumen-Jet!'); }
        else if (st.seeds < seedMax()) { g.got = true; st.seeds = Math.min(seedMax(), st.seeds + 2); say('Zwei Samen vom Blumen-Jet!'); }
        if (g.got) { sfx.seed(); for (let k = 0; k < 16; k++) st.sparkles.push(spark(g.x, g.y, k % 2 ? '#ff9ec7' : '#fff6a0')); }
      }
    }
  }
  st.gifts = st.gifts.filter(g => !g.got && g.x > st.camX - 200 && g.t < 60);

  // Glitzer
  for (const p of st.sparkles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.t -= dt; }
  st.sparkles = st.sparkles.filter(p => p.t > 0);

  // Ziel erreicht
  if (lead >= w.len - 20) {
    st.msgT = 0; st.screenT = 0; sfx.star(); album.star[st.world] = 1; saveAlbum();
    if (st.world === WORLDS.length - 1) { st.screen = 'win'; clearGame(); } else { gotStar(); st.screen = 'star'; try { localStorage.setItem('blumen-spielstand', JSON.stringify({ world: st.world + 1, at: 140, stars: st.stars, seeds: st.seeds })); } catch (e) {} }
  }
}

/* ---------- Malen ---------- */
function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, h, r) : cx.rect(x, y, w, h); }
function circle(x, y, r, c) { cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fillStyle = c; cx.fill(); }

function drawFace(x, y, r, kind, mood) {
  // Augen
  const ex = r * 0.33, ey = y - r * 0.05;
  if (mood === 'sleep') {
    cx.strokeStyle = '#2b1a2f'; cx.lineWidth = Math.max(1.5, r * 0.06); cx.lineCap = 'round';
    for (const sx of [-1, 1]) { cx.beginPath(); cx.arc(x + sx * ex, ey, r * 0.13, Math.PI * 0.1, Math.PI * 0.9); cx.stroke(); }
    circle(x - r * 0.55, y + r * 0.22, r * 0.12, '#ff7aa8aa'); circle(x + r * 0.55, y + r * 0.22, r * 0.12, '#ff7aa8aa');
    circle(x, y + r * 0.35, r * 0.1, '#7a1f3d');
    return;
  }
  for (const sx of [-1, 1]) {
    circle(x + sx * ex, ey, r * 0.17, '#fff');
    circle(x + sx * ex + r * 0.03, ey + r * 0.02, r * 0.11, '#2b1a2f');
    circle(x + sx * ex + r * 0.07, ey - r * 0.04, r * 0.04, '#fff');
    if (kind === 'rose') { // Wimpern
      cx.strokeStyle = '#2b1a2f'; cx.lineWidth = Math.max(1, r * 0.04);
      for (const a of [-0.5, 0, 0.5]) { cx.beginPath(); cx.moveTo(x + sx * ex + a * r * 0.15, ey - r * 0.16); cx.lineTo(x + sx * ex + a * r * 0.3, ey - r * 0.28); cx.stroke(); }
    }
  }
  // Bäckchen
  circle(x - r * 0.55, y + r * 0.22, r * 0.12, '#ff7aa8aa');
  circle(x + r * 0.55, y + r * 0.22, r * 0.12, '#ff7aa8aa');
  // Mund
  cx.strokeStyle = '#7a1f3d'; cx.lineWidth = Math.max(1.5, r * 0.07); cx.lineCap = 'round';
  cx.beginPath();
  if (mood === 'sad') cx.arc(x, y + r * 0.45, r * 0.2, Math.PI * 1.15, Math.PI * 1.85);
  else cx.arc(x, y + r * 0.15, r * 0.25, Math.PI * 0.15, Math.PI * 0.85);
  cx.stroke();
}

// Jede Blume hat ihre eigene tolle Tasche für die Samen
const BAGS = { tulpe: ['#c77dff', '#a64dff', 'heart'], rose: ['#ff4f6d', '#d62f4f', 'star'], sonnenblume: ['#36b6f0', '#1f8fc4', 'flower'], mohn: ['#5cc85c', '#3a9a40', 'bug'] };
function drawBag(x, y, stemH, s, kind, seeds) {
  const [c1, c2, deco] = BAGS[kind];
  const sx = x - 3 * s, sy = y - stemH * 0.78, bx = x + 16 * s, by = y - stemH * 0.32, bw = 24 * s, bh = 19 * s;
  cx.strokeStyle = c2; cx.lineWidth = 2.2 * s; cx.lineCap = 'round'; // Riemen
  cx.beginPath(); cx.moveTo(sx, sy); cx.quadraticCurveTo(bx + 4 * s, sy + 6 * s, bx + bw * 0.35, by - bh / 2); cx.stroke();
  cx.beginPath(); cx.moveTo(sx, sy); cx.lineTo(bx - bw * 0.35, by - bh / 2); cx.stroke();
  // Samen gucken raus
  for (let i = 0; i < Math.min(3, seeds); i++) { cx.fillStyle = '#9b4dff'; cx.beginPath(); cx.ellipse(bx - 6 * s + i * 6 * s, by - bh / 2 - 2 * s, 3 * s, 4.5 * s, (i - 1) * 0.4, 0, 7); cx.fill(); }
  cx.fillStyle = c1; rr(bx - bw / 2, by - bh / 2, bw, bh, 6 * s); cx.fill();
  cx.fillStyle = c2; cx.beginPath(); cx.moveTo(bx - bw / 2, by - bh / 2 + 2 * s); cx.lineTo(bx + bw / 2, by - bh / 2 + 2 * s); cx.quadraticCurveTo(bx, by + bh * 0.25, bx - bw / 2, by - bh / 2 + 2 * s); cx.fill(); // Klappe
  const ex = bx, ey = by + bh * 0.12;
  if (deco === 'heart') { cx.fillStyle = '#ffd6f0'; cx.beginPath(); cx.moveTo(ex, ey + 4 * s); cx.bezierCurveTo(ex - 7 * s, ey - 1 * s, ex - 3 * s, ey - 6 * s, ex, ey - 2.5 * s); cx.bezierCurveTo(ex + 3 * s, ey - 6 * s, ex + 7 * s, ey - 1 * s, ex, ey + 4 * s); cx.fill(); }
  else if (deco === 'star') star5(ex, ey, 5 * s, '#ffd23f');
  else if (deco === 'bug') { circle(ex, ey, 5 * s, '#e8222e'); circle(ex, ey - 4.5 * s, 2.4 * s, '#222'); cx.fillStyle = '#222'; cx.fillRect(ex - 0.4 * s, ey - 3 * s, 0.8 * s, 8 * s); for (const [dx, dy] of [[-2.4, -0.5], [2.4, -0.5], [-2, 2.6], [2, 2.6]]) circle(ex + dx * s, ey + dy * s, 1.1 * s, '#222'); }
  else { for (let i = 0; i < 5; i++) { const a = i * 1.2566; circle(ex + Math.cos(a) * 3 * s, ey + Math.sin(a) * 3 * s, 2.4 * s, '#fff'); } circle(ex, ey, 1.8 * s, '#ffd23f'); }
  star4(bx + bw / 2 - 2 * s, by - bh / 2 + 2 * s, 1.6 * s * (1 + Math.sin(performance.now() / 300 + x)), '#fff6c0'); // Glitzer
}

// Belohnungen: für jeden Stern gibt es etwas zum Anziehen
const WEAR = [
  { id: 'schleife', name: 'Schleife', stars: 1 },
  { id: 'brille', name: 'Sonnenbrille', stars: 2 },
  { id: 'hut', name: 'Sonnenhut', stars: 3 },
  { id: 'krone', name: 'Krone', stars: 4 },
  { id: 'fluegel', name: 'Glitzerflügel', stars: 5 },
];
let unlocked = 0; st.wear = [null, null];
try { unlocked = +(localStorage.getItem('blumen-sterne') || 0); st.wear = JSON.parse(localStorage.getItem('blumen-wear') || '[null,null]'); } catch (e) {}
function saveWear() { try { localStorage.setItem('blumen-sterne', String(unlocked)); localStorage.setItem('blumen-wear', JSON.stringify(st.wear)); } catch (e) {} }
function gotStar() {
  st.stars = Math.min(WORLDS.length - 1, st.stars + 1);
  st.newWear = null;
  if (st.stars > unlocked) { unlocked = st.stars; const it = WEAR[unlocked - 1]; if (it) { st.newWear = it; st.wear = [it.id, it.id]; } saveWear(); }
}

function drawWings(x, y, s, t) {
  const flap = 0.75 + Math.sin(t * 8) * 0.25;
  for (const d of [-1, 1]) {
    cx.save(); cx.translate(x, y); cx.scale(d * flap, 1);
    const g = cx.createLinearGradient(0, -30 * s, 40 * s, 10 * s); g.addColorStop(0, '#8fd6ffdd'); g.addColorStop(1, '#ff9ee0dd');
    cx.fillStyle = g; cx.beginPath(); cx.ellipse(22 * s, -16 * s, 26 * s, 15 * s, -0.5, 0, 7); cx.fill();
    cx.beginPath(); cx.ellipse(18 * s, 10 * s, 17 * s, 10 * s, 0.5, 0, 7); cx.fill();
    cx.strokeStyle = '#ffffffcc'; cx.lineWidth = 1.5 * s; cx.stroke();
    cx.restore();
  }
  for (let i = 0; i < 3; i++) star4(x + Math.cos(t * 3 + i * 2) * 40 * s, y - 10 * s + Math.sin(t * 3 + i * 2) * 20 * s, 2.5 * s, '#fff6c0');
}
function drawWear(id, bx, by, r, kind, t) {
  const s = r / 30, top = by - r * ({ tulpe: 1.3, rose: 1.2, sonnenblume: 1.45, mohn: 1.35 }[kind]);
  const fy = by + (kind === 'tulpe' ? r * 0.15 : r * 0.1), fr = r * 0.8; // Gesicht
  if (id === 'schleife') {
    const x = bx + r * 0.75, y = top + r * 0.35;
    cx.fillStyle = '#ff3d8b';
    cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - 14 * s, y - 9 * s); cx.lineTo(x - 14 * s, y + 9 * s); cx.fill();
    cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + 14 * s, y - 9 * s); cx.lineTo(x + 14 * s, y + 9 * s); cx.fill();
    circle(x, y, 4.5 * s, '#ff7ab3');
  } else if (id === 'brille') {
    const ex = fr * 0.33, ey = fy - fr * 0.05;
    cx.fillStyle = '#2b1a2fee'; for (const d of [-1, 1]) { rr(bx + d * ex - 9 * s, ey - 7 * s, 18 * s, 13 * s, 5 * s); cx.fill(); }
    cx.strokeStyle = '#2b1a2f'; cx.lineWidth = 2.5 * s; cx.beginPath(); cx.moveTo(bx - ex + 9 * s, ey - 2 * s); cx.lineTo(bx + ex - 9 * s, ey - 2 * s); cx.stroke();
    circle(bx - ex - 3 * s, ey - 3 * s, 2 * s, '#ffffffaa'); circle(bx + ex - 3 * s, ey - 3 * s, 2 * s, '#ffffffaa');
  } else if (id === 'hut') {
    cx.fillStyle = '#f2d27a'; cx.beginPath(); cx.ellipse(bx, top + 4 * s, r * 1.15, 8 * s, -0.08, 0, 7); cx.fill();
    cx.fillStyle = '#e8c35f'; cx.beginPath(); cx.ellipse(bx, top - 4 * s, r * 0.55, 15 * s, 0, Math.PI, 0); cx.fill();
    cx.fillStyle = '#ff6fae'; cx.fillRect(bx - r * 0.55, top - 4 * s, r * 1.1, 5 * s);
    circle(bx + r * 0.45, top - 3 * s, 5 * s, '#ffd23f'); circle(bx + r * 0.45, top - 3 * s, 2 * s, '#ff8a5c');
  } else if (id === 'krone') {
    const w = r * 0.9, y = top + 6 * s;
    cx.fillStyle = '#ffd23f'; cx.beginPath(); cx.moveTo(bx - w / 2, y); cx.lineTo(bx - w / 2, y - 18 * s); cx.lineTo(bx - w / 4, y - 8 * s); cx.lineTo(bx, y - 22 * s);
    cx.lineTo(bx + w / 4, y - 8 * s); cx.lineTo(bx + w / 2, y - 18 * s); cx.lineTo(bx + w / 2, y); cx.fill();
    circle(bx, y - 6 * s, 3.5 * s, '#ff4f6d'); circle(bx - w / 3, y - 5 * s, 2.5 * s, '#6fd3ff'); circle(bx + w / 3, y - 5 * s, 2.5 * s, '#9be07a');
    star4(bx + w / 2, y - 18 * s, (1.5 + Math.abs(Math.sin(t * 4))) * s, '#fff');
  }
}

function drawFlower(x, y, kind, size, opts = {}) {
  // x,y = Fuß der Blume am Boden
  const s = size, stemH = 80 * s, bob = opts.bob || 0, lean = opts.lean || 0;
  const stemCol = kind === 'rose' ? '#1f6b34' : kind === 'sonnenblume' ? '#3f9a3a' : '#4caf50';
  const leafCol = kind === 'rose' ? '#2e8b4a' : kind === 'sonnenblume' ? '#5cb84f' : '#66c96a';
  const topX = x + lean * 10 * s, topY = y - stemH + bob;
  cx.save();
  if (opts.alpha != null) cx.globalAlpha = opts.alpha;
  if (opts.wear === 'fluegel') drawWings(topX, topY + 28 * s, s * 1.5, performance.now() / 1000);
  // Stiel
  cx.strokeStyle = stemCol; cx.lineWidth = 7 * s; cx.lineCap = 'round';
  cx.beginPath(); cx.moveTo(x, y); cx.quadraticCurveTo(x - 8 * s, y - stemH * 0.5, topX, topY); cx.stroke();
  // Blätter
  cx.fillStyle = leafCol;
  for (const [side, h] of [[-1, 0.35], [1, 0.55]]) {
    const ly = y - stemH * h, lx = x - 4 * s;
    cx.beginPath(); cx.moveTo(lx, ly);
    cx.quadraticCurveTo(lx + side * 30 * s, ly - 22 * s, lx + side * 42 * s, ly - 6 * s);
    cx.quadraticCurveTo(lx + side * 24 * s, ly + 8 * s, lx, ly); cx.fill();
  }
  if (kind === 'rose') { // kleine Dornen
    cx.fillStyle = '#174f27';
    for (const h of [0.2, 0.7]) { const ty = y - stemH * h; cx.beginPath(); cx.moveTo(x - 3 * s, ty); cx.lineTo(x + 7 * s, ty - 3 * s); cx.lineTo(x - 2 * s, ty - 7 * s); cx.fill(); }
  }
  if (!opts.noBag) drawBag(x, y, stemH, s, kind, opts.seeds || 0);
  // Blüte
  const r = 30 * s, bx = topX, by = topY - r * 0.6;
  if (kind === 'sonnenblume') {
    for (let ring = 0; ring < 2; ring++) for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2 + ring * 0.22; cx.fillStyle = ring ? '#ffd21f' : '#ffb800'; cx.beginPath();
      cx.ellipse(bx + Math.cos(a) * r * 1.05, by + Math.sin(a) * r * 1.05, r * 0.5, r * 0.2, a, 0, 7); cx.fill();
    }
    circle(bx, by, r * 0.88, '#8a5a2b');
    for (let i = 0; i < 18; i++) { const a = i * 2.4, d = Math.sqrt(i / 18) * r * 0.75; circle(bx + Math.cos(a) * d, by + Math.sin(a) * d, r * 0.05, '#6b4220'); }
  } else if (kind === 'mohn') {
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 - Math.PI / 2; cx.fillStyle = i % 2 ? '#e8222e' : '#ff3b3b'; cx.beginPath(); cx.ellipse(bx + Math.cos(a) * r * 0.62, by + Math.sin(a) * r * 0.62, r * 0.68, r * 0.58, a, 0, 7); cx.fill(); }
    cx.strokeStyle = '#c4141f'; cx.lineWidth = 1.5 * s; for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 - Math.PI / 2 + 0.63; cx.beginPath(); cx.moveTo(bx + Math.cos(a) * r * 0.5, by + Math.sin(a) * r * 0.5); cx.lineTo(bx + Math.cos(a) * r * 1.05, by + Math.sin(a) * r * 1.05); cx.stroke(); }
    for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; circle(bx + Math.cos(a) * r * 0.8, by + Math.sin(a) * r * 0.8, r * 0.06, '#2a1a22'); }
    circle(bx, by + r * 0.1, r * 0.72, '#ff6a6a');
  } else if (kind === 'tulpe') {
    cx.fillStyle = '#ff6fae';
    cx.beginPath(); // Kelch mit drei Spitzen
    cx.moveTo(bx - r, by - r * 0.6);
    cx.lineTo(bx - r * 0.55, by - r * 1.25); cx.lineTo(bx - r * 0.15, by - r * 0.75);
    cx.lineTo(bx + r * 0.0, by - r * 1.4); cx.lineTo(bx + r * 0.15, by - r * 0.75);
    cx.lineTo(bx + r * 0.55, by - r * 1.25); cx.lineTo(bx + r, by - r * 0.6);
    cx.quadraticCurveTo(bx + r * 1.05, by + r * 0.9, bx, by + r * 0.95);
    cx.quadraticCurveTo(bx - r * 1.05, by + r * 0.9, bx - r, by - r * 0.6);
    cx.fill();
    cx.fillStyle = '#ff94c4'; cx.beginPath(); cx.ellipse(bx, by + r * 0.15, r * 0.78, r * 0.72, 0, 0, Math.PI * 2); cx.fill();
  } else {
    const petals = 9;
    for (let i = 0; i < petals; i++) { const a = i / petals * Math.PI * 2; circle(bx + Math.cos(a) * r * 0.75, by + Math.sin(a) * r * 0.75, r * 0.5, '#ff4f93'); }
    circle(bx, by, r * 0.95, '#ff6fa8');
    cx.strokeStyle = '#e03b7d'; cx.lineWidth = 2.2 * s;
    cx.beginPath(); cx.arc(bx, by - r * 0.55, r * 0.35, Math.PI * 0.9, Math.PI * 2.1); cx.stroke();
    cx.beginPath(); cx.arc(bx, by - r * 0.6, r * 0.18, Math.PI * 0.2, Math.PI * 1.6); cx.stroke();
  }
  drawFace(bx, by + (kind === 'tulpe' ? r * 0.15 : r * 0.1), r * 0.8, kind, opts.mood);
  if (opts.wear && opts.wear !== 'fluegel') drawWear(opts.wear, bx, by, r, kind, performance.now() / 1000);
  cx.restore();
}

function drawLeaf(x, y, t) {
  cx.save(); cx.translate(x, y); cx.rotate(Math.sin(t * 3) * 0.35);
  const s = S;
  cx.fillStyle = '#8b5a2b';
  cx.beginPath(); cx.moveTo(-34 * s, 0);
  cx.quadraticCurveTo(-10 * s, -30 * s, 30 * s, -6 * s);

function drawSeed(x, y, t) {

function star4(x, y, r, c) {
  cx.fillStyle = c; cx.beginPath();
  cx.moveTo(x, y - r * 2); cx.lineTo(x + r * 0.5, y - r * 0.5); cx.lineTo(x + r * 2, y); cx.lineTo(x + r * 0.5, y + r * 0.5);
  cx.lineTo(x, y + r * 2); cx.lineTo(x - r * 0.5, y + r * 0.5); cx.lineTo(x - r * 2, y); cx.lineTo(x - r * 0.5, y - r * 0.5); cx.fill();
}
function star5(x, y, r, c, stroke) {
  cx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; cx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  cx.closePath(); cx.fillStyle = c; cx.fill();
  if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = 3; cx.stroke(); }
}
function heart(x, y, r, full) {
  cx.beginPath();
  cx.moveTo(x, y + r * 0.9);
  cx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.4);
  cx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
  cx.fillStyle = full ? '#ff3b6b' : '#ffffff55'; cx.fill();

function drawGround(w, cam) {
  cx.fillStyle = w.dirt; cx.beginPath(); cx.moveTo(0, H);
  for (let x = 0; x <= W + 10; x += 10) cx.lineTo(x, groundY(x + cam) + 14 * S);
  cx.lineTo(W, H); cx.fill();
  cx.fillStyle = w.ground; cx.beginPath(); cx.moveTo(0, H);
  for (let x = 0; x <= W + 10; x += 10) cx.lineTo(x, groundY(x + cam));
  for (let x = W + 10; x >= 0; x -= 10) cx.lineTo(x, groundY(x + cam) + 16 * S);
  cx.fill();
  if (w.deco === 'regenbogen') for (let k = 0; k < 6; k++) { cx.strokeStyle = RAINBOW[k]; cx.lineWidth = 2.8 * S; cx.beginPath();
    for (let x = 0; x <= W + 10; x += 10) cx.lineTo(x, groundY(x + cam) + (1.5 + k * 2.5) * S); cx.stroke(); }
  if (w.deco === 'suess') for (let i = Math.floor(cam / 40); i < (cam + W) / 40 + 1; i++) { const r = Math.abs(Math.sin(i * 3.17) * 999) % 1; cx.save(); cx.translate(i * 40 - cam, groundY(i * 40) + (4 + r * 8) * S); cx.rotate(r * 6);

}

function drawGift(g, cam, t) {

  cx.fillStyle = '#ffd23f'; cx.fillRect(x - 2.5 * s, y - 13 * s - b, 5 * s, 26 * s); cx.fillRect(x - 13 * s, y - 2.5 * s - b, 26 * s, 5 * s);
  circle(x - 5 * s, y - 16 * s - b, 5 * s, '#ffd23f'); circle(x + 5 * s, y - 16 * s - b, 5 * s, '#ffd23f');

function drawGoal(w, cam, t) {
  const gx = w.len - cam, gy = groundY(w.len);
  if (gx < -100 || gx > W + 100) return;
  // Torbogen mit Stern
  cx.strokeStyle = '#ffd23f'; cx.lineWidth = 10 * S; cx.lineCap = 'round';
  cx.beginPath(); cx.arc(gx, gy - 10 * S, 80 * S, Math.PI, 0); cx.stroke();

function hud(t) {
  const s = Math.max(0.75, S);
  for (let i = 0; i < 4; i++) heart(30 * s + i * 40 * s, 32 * s, 14 * s, i < st.hearts);
  for (let i = 0; i < seedMax(); i++) {
    const x = 30 * s + (i % 5) * 32 * s, y = 76 * s + Math.floor(i / 5) * 28 * s;
    if (i < st.seeds) drawSeedSmall(x, y, t + i); else { circle(x, y, 9 * s, '#ffffff33'); }

  for (let i = 0; i < WORLDS.length - 1; i++) star5(W - 26 * s - (i % 5) * 30 * s - Math.floor(i / 5) * 15 * s, 24 * s + Math.floor(i / 5) * 26 * s, 11 * s, i < st.stars ? '#ffd23f' : '#ffffff44', i < st.stars ? '#fff' : null);

  cx.strokeText(nm, W - 26 * s, 84 * s); cx.fillText(nm, W - 26 * s, 84 * s);
  // Fortschritt

  star5(px + pw + 14 * s, py + 5 * s, 10 * s, '#ffd23f');

}
function drawSeedSmall(x, y, t) { const s = Math.max(0.75, S); cx.fillStyle = '#9b4dff'; cx.beginPath(); cx.ellipse(x, y, 7 * s, 10 * s, 0, 0, 7); cx.fill(); circle(x - 2 * s, y - 4 * s, 2 * s, '#e9d2ff'); star4(x + 8 * s, y - 8 * s, (1.5 + Math.abs(Math.sin(t * 4)) * 1.5) * s, '#fff6c0'); }

function bubble(text, x, y, a = 1) {

  if (st.two) { drawFlower(W / 2 - 90 * S, H * 0.8, st.kind, S * 1.4, { wear: st.wear[0], bob: Math.sin(t * 5) * 8 }); drawFlower(W / 2 + 90 * S, H * 0.8, st.kind2, S * 1.4, { wear: st.wear[1], bob: Math.sin(t * 5 + 1) * 8 }); }
  else drawFlower(W / 2, H * 0.8, st.kind, S * 1.5, { wear: st.wear[0], bob: Math.sin(t * 5) * 8 });
  bigText('' + (st.two ? 'Hurra! Ihr habt die ganze Welt besucht!' : 'Hurra! Du hast die ganze Welt besucht!') + '', H * 0.14, 34 * S);
  for (let i = 0; i < 30; i++) { const a = t * 0.8 + i; star4(W / 2 + Math.cos(a * 1.3) * W * 0.4, (H * 0.5 + Math.sin(a) * H * 0.3), 3 * S, ['#ff6fae', '#c77dff', '#ffd23f'][i % 3]); }
  if (st.screenT > 2) bigText('Tippe, um nochmal zu spielen', H * 0.93, 20 * S, '#fff6c0');
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  update(dt);
  document.body.classList.toggle('playing', st.screen === 'play');
  document.body.classList.toggle('ingame', st.screen !== 'start');
  document.body.classList.toggle('bossfight', !!(st.screen === 'play' && st.boss && !st.boss.defeated));
  cx.clearRect(0, 0, W, H);
  if (st.screen === 'start') drawStart(t);
  else if (st.screen === 'play') drawPlay(t);
  else if (st.screen === 'star') drawStar(t);
  else if (st.screen === 'home') drawHome(t);
  else drawWin(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
