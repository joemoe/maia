<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>maia.games</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="maia.games" />
    <meta name="theme-color" content="#7ec0ee" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        background: linear-gradient(#7ec0ee, #bfe6ff 70%, #8fd16a 70%, #6bbf4a);
        background-attachment: fixed;
        font-family: "Press Start 2P", system-ui, sans-serif;
        color: #23324a;
        padding: max(24px, env(safe-area-inset-top)) 16px 32px;
        -webkit-tap-highlight-color: transparent;
      }
      h1 {
        text-align: center;
        font-size: clamp(22px, 6vw, 44px);
        color: #fff;
        text-shadow: 3px 3px 0 #23324a;
        margin: 8px 0 8px;
        letter-spacing: 1px;
      }
      p.sub {
        text-align: center;
        font-size: clamp(10px, 2.6vw, 14px);
        color: #23324a;
        margin-bottom: 28px;
      }
      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 24px;
        max-width: 860px;
        margin: 0 auto;
      }
      a.game {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-decoration: none;
        color: inherit;
        background: #fffdf5;
        border: 4px solid #23324a;
        border-radius: 20px;
        padding: 22px 16px 24px;
        box-shadow: 0 8px 0 #23324a;
        transition: transform 0.12s, box-shadow 0.12s;
      }
      a.game:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #23324a; }
      a.game:active { transform: translateY(6px); box-shadow: 0 2px 0 #23324a; }
      .pic {
        width: 100%;
        height: 180px;
        border-radius: 12px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
      }
      .pic img { height: 92%; image-rendering: pixelated; }
      .pic svg { height: 100%; }
      .maia .pic { background: linear-gradient(#7ec0ee, #bfe6ff); }
      .blumen .pic { background: linear-gradient(#ffd6ec, #fff3b0); }
      .flitzer .pic { background: linear-gradient(#fff3b0, #ffcf3f); }
      .wild .pic { background: linear-gradient(#bfe9b9, #5cae52); }
      .chaos .pic { background: linear-gradient(#d9c2ff, #ff9ad5); }
      .mauli .pic { background: linear-gradient(#9fd8ff 0 45%, #7cc35a 45% 55%, #8a5a34 55%); }
      .heilig .pic { background: linear-gradient(#0b1633, #2a4688 70%, #eef4fb 70%); }
      .name { font-size: clamp(13px, 3.4vw, 17px); text-align: center; line-height: 1.5; }
      .by { font-family: system-ui, sans-serif; font-size: 14px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>maia.games</h1>
    <p class="sub">Such dir ein Spiel aus!</p>
    <main class="games">
