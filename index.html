<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>maia.games</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="maia.games" />
    <meta name="theme-color" content="#7ec0ee" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        background: linear-gradient(#7ec0ee, #bfe6ff 70%, #8fd16a 70%, #6bbf4a);
        background-attachment: fixed;
        font-family: "Press Start 2P", system-ui, sans-serif;
        color: #23324a;
        padding: max(24px, env(safe-area-inset-top)) 16px 32px;
        -webkit-tap-highlight-color: transparent;
      }
      h1 {
        text-align: center;
        font-size: clamp(22px, 6vw, 44px);
        color: #fff;
        text-shadow: 3px 3px 0 #23324a;
        margin: 8px 0 8px;
        letter-spacing: 1px;
      }
      p.sub {
        text-align: center;
        font-size: clamp(10px, 2.6vw, 14px);
        color: #23324a;
        margin-bottom: 28px;
      }
      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 24px;
        max-width: 860px;
        margin: 0 auto;
      }
      a.game {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-decoration: none;
        color: inherit;
        background: #fffdf5;
        border: 4px solid #23324a;
        border-radius: 20px;
        padding: 22px 16px 24px;
        box-shadow: 0 8px 0 #23324a;
        transition: transform 0.12s, box-shadow 0.12s;
      }
      a.game:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #23324a; }
      a.game:active { transform: translateY(6px); box-shadow: 0 2px 0 #23324a; }
      .pic {
        width: 100%;
        height: 180px;
        border-radius: 12px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
      }
      .pic img { height: 92%; image-rendering: pixelated; }
      .pic svg { height: 100%; }
      .maia .pic { background: linear-gradient(#7ec0ee, #bfe6ff); }
      .blumen .pic { background: linear-gradient(#ffd6ec, #fff3b0); }
      .flitzer .pic { background: linear-gradient(#fff3b0, #ffcf3f); }
      .name { font-size: clamp(13px, 3.4vw, 17px); text-align: center; line-height: 1.5; }
      .by { font-family: system-ui, sans-serif; font-size: 14px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <h1>maia.games</h1>
    <p class="sub">Such dir ein Spiel aus!</p>
    <main class="games">
      <a class="game maia" href="/maia/">
        <div class="pic"><img src="/maia/img/maia.png" alt="" /></div>
        <div class="name">Maia und die große Welt</div>
      </a>
      <a class="game blumen" href="/blumenspiel/">
        <div class="pic">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <path d="M60 118 C60 95 58 80 60 62" stroke="#3f9a3a" stroke-width="6" fill="none" stroke-linecap="round" />
            <path d="M60 98 C44 88 34 92 28 100 C40 104 50 104 60 98Z" fill="#5cbf4f" />
            <path d="M60 88 C76 78 86 82 92 90 C80 94 70 94 60 88Z" fill="#5cbf4f" />
            <path d="M40 30 C38 50 46 64 60 66 C74 64 82 50 80 30 C72 40 66 40 60 26 C54 40 48 40 40 30Z" fill="#ff5fa2" stroke="#c2306f" stroke-width="2.5" />
            <circle cx="52" cy="50" r="3" fill="#23324a" />
            <circle cx="68" cy="50" r="3" fill="#23324a" />
            <path d="M54 57 Q60 62 66 57" stroke="#23324a" stroke-width="2.5" fill="none" stroke-linecap="round" />
          </svg>
        </div>
        <div class="name">Blumenspiel</div>
      </a>
      <a class="game flitzer" href="/schwarzach/">
        <div class="pic">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <rect x="0" y="70" width="120" height="50" fill="#7d8496" />
            <path d="M0 95 H120" stroke="#fff6c2" stroke-width="3" stroke-dasharray="10 8" />
            <rect x="72" y="20" width="34" height="50" fill="#f4ead8" />
            <path d="M68 22 L89 6 L110 22Z" fill="#ff7b6b" />
            <rect x="80" y="34" width="8" height="10" fill="#8ec5ff" /><rect x="92" y="34" width="8" height="10" fill="#8ec5ff" />
            <circle cx="30" cy="104" r="6" fill="#23324a" /><circle cx="64" cy="104" r="6" fill="#23324a" />
            <rect x="26" y="96" width="40" height="6" rx="3" fill="#2ec4b6" />
            <path d="M62 98 L58 58" stroke="#23324a" stroke-width="4" stroke-linecap="round" />
            <path d="M50 58 H66" stroke="#23324a" stroke-width="4" stroke-linecap="round" />
            <circle cx="44" cy="52" r="9" fill="#f5d0b0" />
            <path d="M35 50 Q44 38 53 50Z" fill="#ffcf3f" />
            <path d="M40 62 Q44 80 46 94" stroke="#ff5fa2" stroke-width="10" stroke-linecap="round" fill="none" />
            <path d="M48 66 L60 60" stroke="#f5d0b0" stroke-width="4" stroke-linecap="round" />
          </svg>
        </div>
        <div class="name">Grand Schliefar Schwarzach</div>
      </a>
    </main>
  </body>
</html>
